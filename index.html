<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
overflow:hidden;
color:white;
}

#root{width:100%;height:100%;}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
position:relative;
}

h1{color:#00f0ff;font-size:48px;}
h2{font-size:26px;}

button{
width:85%;
height:80px;
margin:10px;
border:none;
border-radius:18px;
font-size:20px;
font-weight:bold;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
}

.box{
width:85%;
height:260px;
border-radius:20px;
border:2px solid #00f0ff;
position:relative;
overflow:hidden;
background:rgba(0,255,255,0.06);
}

.target{
width:40px;
height:40px;
border-radius:50%;
background:#00f0ff;
position:absolute;
box-shadow:0 0 15px #00f0ff;
cursor:pointer;
}

.light{
width:120px;
height:120px;
border-radius:50%;
background:red;
box-shadow:0 0 40px red;
}

.big{font-size:55px;color:#00f0ff;}

</style>
</head>

<body>

<div id="root"></div>

<script type="module">

const root=document.getElementById("root");

/* ================= STATE ================= */
let gameIndex=0;
let total=0;
let score=0;

let user=null;
let inputLocked=false;

/* FIX SPACE GLOBAL */
document.addEventListener("keydown",(e)=>{
if(e.code==="Space") e.preventDefault();
},{passive:false});

/* ================= RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= RESET ================= */
function reset(){
window.onkeydown=null;
window.onkeyup=null;
inputLocked=false;
}

/* ================= LOGIN SYSTEM ================= */
function loginScreen(){

render(`
<div class="screen">
<h1>⚡ TYMERZ LOGIN</h1>

<input id="u" placeholder="username" style="width:80%;height:50px;text-align:center;font-size:18px;">
<input id="p" placeholder="password" type="password" style="width:80%;height:50px;text-align:center;font-size:18px;">

<button onclick="login()">Connexion</button>

<p>ADMIN PASSWORD = TYMERZ2026</p>
</div>
`);

}

window.login=()=>{

let u=document.getElementById("u").value;
let p=document.getElementById("p").value;

/* admin bypass */
if(p==="TYMERZ2026"){
user="ADMIN";
menu();
return;
}

if(!u || u.length<2) return;

user=u;

menu();

};

/* ================= BOOT ================= */
boot();

function boot(){

user=localStorage.getItem("tymerz_user");

if(!user){
loginScreen();
}else{
menu();
}

}

/* ================= MENU ================= */
function menu(){

reset();

render(`
<div class="screen">
<h1>⚡ TYMERZ</h1>

<p>${user}</p>

<button onclick="start()">JOUER</button>
<button onclick="showBoard()">CLASSEMENT</button>
</div>
`);

}

/* ================= START ================= */
window.start=()=>{
gameIndex=0;
total=0;
next();
};

/* ================= FLOW ================= */
function next(){
intro();
}

/* ================= INTRO ================= */
function intro(){

reset();

const txt=[
"HOLD SPACE 5s",
"FEU VERT",
"DOUBLE SPACE 9s",
"SPAM",
"CIBLES"
];

render(`
<div class="screen">
<h2>${txt[gameIndex]}</h2>

<button onclick="startGame()">START</button>
</div>
`);

window.onkeydown=(e)=>{
if(e.code==="Space") startGame();
};

}

/* ================= START GAME ================= */
window.startGame=()=>{

reset();
score=0;

if(gameIndex===0) game1();
if(gameIndex===1) game2();
if(gameIndex===2) game3();
if(gameIndex===3) game4();
if(gameIndex===4) game5();

};

/* ================= GAME 1 ================= */
function game1(){

let start=0;
let holding=false;
let timer;

render(`<div class="screen"><h2>MAINTIENS SPACE</h2></div>`);

window.onkeydown=(e)=>{

if(e.code!=="Space") return;

if(!holding){
holding=true;
start=Date.now();

timer=setTimeout(()=>{
score=1000;
endGame();
},5000);
}

};

window.onkeyup=(e)=>{

if(e.code!=="Space") return;

if(!holding) return;

clearTimeout(timer);

let t=Date.now()-start;

score=Math.max(0,1000-(Math.abs(5000-t)/5));

endGame(`⏱ ${(t/1000).toFixed(2)}s`);

};

}

/* ================= GAME 2 ================= */
function game2(){

let green=false;
let start=0;

render(`
<div class="screen">
<h2>ATTENDS VERT</h2>
<div class="light"></div>
</div>
`);

const light=document.querySelector(".light");

window.onkeydown=(e)=>{

if(e.code!=="Space") return;
if(!green) return;
if(inputLocked) return;

score=Math.max(0,1000-(Date.now()-start));
endGame();

};

setTimeout(()=>{

green=true;
start=Date.now();

light.style.background="green";
light.style.boxShadow="0 0 40px green";

},1500);

}

/* ================= GAME 3 FIXED 9s ================= */
function game3(){

let started=false;
let start=0;
let waiting=false;

render(`<div class="screen"><h2>SPACE → attendre → SPACE</h2></div>`);

window.onkeydown=(e)=>{

if(e.code!=="Space") return;

if(!started){

started=true;
start=Date.now();
waiting=true;

setTimeout(()=>waiting=false,9000);

return;
}

/* IMPORTANT FIX: plus de baisse de score */
if(started && !waiting){

let t=Date.now()-start;

let diff=Math.abs(t-9000);

score=Math.max(0,1000-(diff/10));

endGame(`⏱ ${(t/1000).toFixed(2)}s`);

}

};

}

/* ================= GAME 4 SPAM ================= */
function game4(){

let count=0;
let start=Date.now();

render(`
<div class="screen">
<h2>🔥 SPAM</h2>

<div class="box"></div>
<h1 id="c">0</h1>
</div>
`);

const c=document.getElementById("c");

window.onclick=()=>{if(!inputLocked){count++;c.innerText=count;}};

window.onkeydown=(e)=>{
if(e.code==="Space" && !inputLocked){
count++;
c.innerText=count;
}
};

setTimeout(()=>{

let t=(Date.now()-start)/1000;
let cps=count/t;

score=Math.min(1000,cps*120);

endGame(`🔥 ${count} | ${cps.toFixed(2)} CPS`);

},5000);

}

/* ================= GAME 5 ================= */
function game5(){

let hits=0;

render(`
<div class="screen">
<h2>🎯 CIBLES</h2>

<div class="box" id="arena"></div>
<h1 id="h">0</h1>
</div>
`);

const arena=document.getElementById("arena");
const h=document.getElementById("h");

function spawn(){

arena.innerHTML="";

for(let i=0;i<5;i++){

const t=document.createElement("div");
t.className="target";

t.style.left=Math.random()*80+"%";
t.style.top=Math.random()*80+"%";

t.onclick=()=>{

if(inputLocked) return;

hits++;
h.innerText=hits;
t.remove();

if(hits===5){
score=1000;
endGame("perfect");
}

};

arena.appendChild(t);

}

}

spawn();

setTimeout(()=>{

if(hits<5){
score=Math.min(1000,hits*200);
endGame("timeout");
}

},5000);

}

/* ================= END ================= */
function endGame(detail=""){

inputLocked=true;

total+=score;

render(`
<div class="screen">
<h2>Score</h2>

<h1 class="big">${Math.round(score)}</h1>

<p>${detail}</p>

<p>Total: ${total}/5000</p>

<button onclick="nextGame()">SUIVANT</button>
</div>
`);

}

/* ================= NEXT ================= */
window.nextGame=()=>{

gameIndex++;

if(gameIndex>=5){
final();
}else{
next();
}

};

/* ================= FINAL ================= */
function final(){

saveScore();

render(`
<div class="screen">
<h1>🏆 FIN</h1>

<h2>${total}/5000</h2>

<button onclick="menu()">MENU</button>
<button onclick="start()">REJOUER</button>
<button onclick="showBoard()">CLASSEMENT</button>
</div>
`);

}

/* ================= LEADERBOARD FIX ================= */
function saveScore(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

board.push({user,total});

board.sort((a,b)=>b.total-a.total);

board=board.slice(0,10);

localStorage.setItem("board",JSON.stringify(board));

}

function showBoard(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

render(`
<div class="screen">
<h2>🏆 CLASSEMENT</h2>

${board.map((b,i)=>`<p>${i+1}. ${b.user} - ${b.total}</p>`).join("")}

<button onclick="menu()">BACK</button>
</div>
`);

}

</script>

</body>
</html>
