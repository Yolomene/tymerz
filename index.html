<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tymerz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body {
  font-family: 'Segoe UI', sans-serif;
  background:#0f172a;
  color:#e2e8f0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.container { width:100%; max-width:520px; }
.card {
  background:#111827;
  padding:40px 30px;
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  text-align:center;
}
h1 { font-size:28px; margin-bottom:10px; }
h2 { margin-bottom:20px; font-weight:500; }
button {
  padding:14px 24px;
  margin:10px;
  border-radius:10px;
  background:transparent;
  color:#e2e8f0;
  border:2px solid #334155;
  cursor:pointer;
  transition:0.2s;
}
button:hover {
  border-color:#60a5fa;
  color:#60a5fa;
}
.next { border-color:#f59e0b; }
input {
  padding:12px;
  width:80%;
  border-radius:10px;
  border:2px solid #334155;
  background:transparent;
  color:white;
}
.hidden { display:none; }
.score { margin-top:20px; font-size:20px; }
.leaderboard { margin-top:20px; font-size:14px; opacity:0.9; }
</style>
</head>
<body>

<div class="container">
<div class="card">
<h1>⏱ ChronoChallenge</h1>
<h2 id="title"></h2>
<div id="content"></div>
<p class="score" id="score"></p>
<button class="next hidden" id="nextBtn" onclick="nextGame()">Suivant →</button>
<div class="leaderboard" id="leaderboard"></div>
</div>
</div>

<script>
let currentGame = -1;
let totalScore = 0;
let scores = [];
let user = null;

// ⚠️ SIMULATION API (remplace par vrai backend plus tard)
const API_URL = "https://example.com/leaderboard";

async function saveScoreOnline(){
  try {
    await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name:user, score:totalScore})
    });
  } catch(e){ console.log("offline mode"); }
}

async function loadLeaderboard(){
  try {
    let res = await fetch(API_URL);
    let data = await res.json();
    return data;
  } catch(e){
    return [];
  }
}

function showNextBtn(){ document.getElementById('nextBtn').classList.remove('hidden'); }
function nextGame(){ currentGame++; document.getElementById('nextBtn').classList.add('hidden'); loadGame(); }

function setScore(value){
 let s = Math.max(0, Math.min(1000, Math.round(value)));
 scores.push(s);
 totalScore += s;
 document.getElementById('score').innerText = "Score : " + s;
 showNextBtn();
}

// CONTROLE ESPACE
let spaceDown=false;
document.addEventListener('keydown', e=>{
 if(e.code==='Space' && !spaceDown){ spaceDown=true; if(window.onSpaceDown) window.onSpaceDown(); }
});

document.addEventListener('keyup', e=>{
 if(e.code==='Space'){ spaceDown=false; if(window.onSpaceUp) window.onSpaceUp(); }
});

async function loadGame(){
 const title=document.getElementById('title');
 const content=document.getElementById('content');
 const score=document.getElementById('score');
 const lb=document.getElementById('leaderboard');
 score.innerText="";
 lb.innerHTML="";
 window.onSpaceDown=null;
 window.onSpaceUp=null;

 if(currentGame===-1){
  title.innerText="Entre ton pseudo";
  content.innerHTML='<input id="name" placeholder="Pseudo"><br><button onclick="login()">Commencer</button>';
 }

 else if(currentGame===0){
  title.innerText="Maintiens 5 secondes";
  content.innerHTML='<p>Maintiens ESPACE</p>';
  let start;
  window.onSpaceDown=()=>start=Date.now();
  window.onSpaceUp=()=>{
   let t=(Date.now()-start)/1000;
   setScore(1000-Math.abs(5-t)*200);
  }
 }

 else if(currentGame===1){
  title.innerText="Réaction";
  content.innerHTML='<p>Attends...</p>';
  let start,ready=false;
  setTimeout(()=>{ready=true;start=Date.now();content.innerHTML='<p>GO !</p>';},Math.random()*3000+2000);
  window.onSpaceDown=()=>{ if(ready){ let t=Date.now()-start; setScore(1000-t);} }
 }

 else if(currentGame===2){
  title.innerText="10 secondes";
  content.innerHTML='<p>Appuie ESPACE</p>';
  let start=Date.now();
  window.onSpaceDown=()=>{
    let t=(Date.now()-start)/1000;
    setScore(1000-Math.abs(10-t)*100);
  }
 }

 else if(currentGame===3){
  title.innerText="Spam espace";
  content.innerHTML='<p>Spam !</p>';
  let c=0;
  window.onSpaceDown=()=>c++;
  setTimeout(()=>setScore(c*50),5000);
 }

 else if(currentGame===4){
  title.innerText="3 secondes";
  content.innerHTML='<p>Appuie ESPACE</p>';
  let start=Date.now();
  window.onSpaceDown=()=>{
    let t=(Date.now()-start)/1000;
    setScore(1000-Math.abs(3-t)*300);
  }
 }

 else {
  await saveScoreOnline();
  let data = await loadLeaderboard();
  title.innerText="Résultats";
  content.innerHTML = scores.map((s,i)=>`Jeu ${i+1} : ${s}`).join('<br>') + `<br><br><b>Total : ${totalScore}</b>`;

  lb.innerHTML = '<h3>Leaderboard</h3>' + (data.slice(0,5).map(p=>`${p.name} : ${p.score}`).join('<br>') || "Aucun score");
 }
}

function login(){ user=document.getElementById('name').value||"Joueur"; nextGame(); }

loadGame();
</script>

</body>
</html>
