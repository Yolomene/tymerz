<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYmerz DEBUG</title>

<script type="module">

/* ================= SUPABASE IMPORT ================= */
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ================= CONFIG ================= */
const SUPABASE_URL = "https://lsgrfmweasnjzkwzhnys.supabase.co";
const SUPABASE_KEY = "COLLE_TA_ANON_KEY_ICI";

console.log("🚀 START DEBUG SUPABASE");
console.log("URL:", SUPABASE_URL);
console.log("KEY (preview):", SUPABASE_KEY.slice(0,25) + "...");

/* ================= INIT ================= */
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

console.log("✅ CLIENT CREATED");

/* ================= FULL TEST ================= */
async function fullTest(){

  console.log("🧪 TEST 1: BASIC CONNECTION...");

  try {
    const { data, error } = await supabase.auth.getSession();
    console.log("AUTH SESSION:", data, error);
  } catch (e) {
    console.log("❌ AUTH ERROR:", e);
  }

  console.log("🧪 TEST 2: TABLE USERS...");

  const res = await supabase
    .from("users")
    .select("*")
    .limit(1);

  console.log("📦 USERS DATA:", res.data);
  console.log("❌ USERS ERROR:", res.error);

  console.log("🧪 TEST 3: INSERT TEST (SAFE)...");

  const testInsert = await supabase
    .from("users")
    .insert({
      username: "debug_user",
      password: "1234",
      score: 0
    })
    .select();

  console.log("📥 INSERT RESULT:", testInsert.data);
  console.log("❌ INSERT ERROR:", testInsert.error);

}

/* run test */
fullTest();

</script>

</head>
