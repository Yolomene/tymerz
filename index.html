<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
color:white;
overflow:hidden;
}

#root{width:100%;height:100%;}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

button{
width:80%;
height:80px;
margin:10px;
border-radius:15px;
border:none;
background:#00f0ff;
font-size:20px;
}

.box{
width:80%;
height:250px;
border:2px solid #00f0ff;
position:relative;
}

.target{
width:40px;
height:40px;
border-radius:50%;
background:#00f0ff;
position:absolute;
}

.bigCircle{
width:160px;
height:160px;
border-radius:50%;
background:gray;
}
</style>
</head>

<body>

<div id="root"></div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://lsgrfmweasnjzkwzhnys.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= STATE ================= */
const root = document.getElementById("root");

let user = null;
let game = 0;
let total = 0;
let score = 0;

/* ================= RENDER ================= */
function render(html){
root.innerHTML = html;
}

/* ================= LOGIN ================= */
function loginScreen(){
render(`
<div class="screen">
<h1>TYMERZ</h1>
<input id="u" placeholder="username">
<button onclick="login()">GO</button>
</div>
`);
}

window.login = ()=>{
user = document.getElementById("u").value;
menu();
};

/* ================= MENU ================= */
function menu(){
render(`
<div class="screen">
<h1>TYMERZ</h1>
<p>${user}</p>

<button onclick="start()">PLAY</button>
<button onclick="leaderboard()">LEADERBOARD</button>
</div>
`);
}

/* ================= START ================= */
window.start = ()=>{
game = 0;
total = 0;
next();
};

function next(){
intro();
}

/* ================= INTRO ================= */
function intro(){

const names = [
"HOLD 5s",
"REACTION",
"TOGGLE",
"SPAM",
"CIBLES"
];

render(`
<div class="screen">
<h2>${names[game]}</h2>
<button onclick="startGame()">START</button>
</div>
`);
}

window.startGame = ()=>{
if(game===0) g1();
if(game===1) g2();
if(game===2) g3();
if(game===3) g4();
if(game===4) g5();
};

/* ================= GAME 1 FIX ================= */
function g1(){

let start=0;
let hold=false;
let timer=null;

render(`<div class="screen"><h2>HOLD SPACE 5s</h2></div>`);

window.onkeydown=(e)=>{
if(e.code!=="Space") return;
if(!hold){
hold=true;
start=Date.now();
timer=setTimeout(()=>{
score=1000;
end();
},5000);
}
};

window.onkeyup=(e)=>{
if(e.code!=="Space") return;

clearTimeout(timer);

let t=Date.now()-start;
score=Math.max(0,1000-Math.abs(5000-t)/5);

end();
};

function end(){
window.onkeydown=null;
window.onkeyup=null;
endGame();
}

}

/* ================= GAME 2 ================= */
function g2(){

let green=false;
let start=0;

render(`<div class="screen"><h2>WAIT GREEN</h2><div class="bigCircle"></div></div>`);

setTimeout(()=>{
green=true;
start=Date.now();
document.querySelector(".bigCircle").style.background="green";
},1500);

window.onkeydown=(e)=>{
if(e.code!=="Space") return;
if(!green) return;

score=Math.max(0,1000-(Date.now()-start));
endGame();
};

}

/* ================= GAME 3 ================= */
function g3(){

let start=0;
let running=false;

render(`<div class="screen"><h2>TOGGLE</h2></div>`);

window.onkeydown=(e)=>{
if(e.code!=="Space") return;

if(!running){
running=true;
start=Date.now();
}else{
let t=Date.now()-start;
score=Math.max(0,1000-Math.abs(9000-t)/8);
endGame();
}
};

}

/* ================= GAME 4 ================= */
function g4(){

let count=0;
let start=Date.now();

render(`<div class="screen"><h2>SPAM</h2><h1 id="c">0</h1></div>`);

window.onclick=()=>{count++;document.getElementById("c").innerText=count};

setTimeout(()=>{
score=Math.min(1000,count*50);
endGame();
},5000);

}

/* ================= GAME 5 ================= */
function g5(){

let hits=0;
let needed=6;
let start=Date.now();

render(`<div class="screen"><h2>CIBLES</h2><div class="box" id="box"></div></div>`);

const box=document.getElementById("box");

for(let i=0;i<needed;i++){

const t=document.createElement("div");
t.className="target";

t.style.left=Math.random()*80+"%";
t.style.top=Math.random()*80+"%";

t.onclick=()=>{

hits++;
t.remove();

if(hits===needed){
let time=(Date.now()-start)/1000;
score=Math.max(300,1000-time*300);
endGame();
}

};

box.appendChild(t);
}

}

/* ================= END ================= */
function endGame(){

total+=score;

render(`
<div class="screen">
<h2>${Math.round(score)}</h2>
<p>Total ${total}</p>

<button onclick="nextGame()">NEXT</button>
</div>
`);
}

/* ================= NEXT ================= */
window.nextGame=()=>{
game++;
if(game>=5) final();
else next();
};

/* ================= FINAL ================= */
function final(){
saveScore();

render(`
<div class="screen">
<h1>FIN</h1>
<h2>${total}</h2>
<button onclick="menu()">MENU</button>
<button onclick="start()">RETRY</button>
</div>
`);
}

/* ================= LEADERBOARD ================= */
async function saveScore(){
await supabase.from("scores").insert([{user,total}]);
}

async function leaderboard(){

const {data} = await supabase
.from("scores")
.select("*")
.order("total",{ascending:false})
.limit(10);

render(`
<div class="screen">
<h2>LEADERBOARD</h2>

${data.map((d,i)=>`
<p>${i+1}. ${d.user} - ${d.total}</p>
`).join("")}

<button onclick="menu()">BACK</button>
</div>
`);
}

loginScreen();

</script>
</body>
</html>
