<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYMERZ AAA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
height:100vh;
background: radial-gradient(circle at top, #0b1c3f, #020617);
color:white;
font-family: 'Segoe UI', sans-serif;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* ===== MAIN ===== */
#app{
width:100%;
max-width:900px;
}

/* ===== HEADER ===== */
.header{
text-align:center;
margin-bottom:30px;
opacity:0.8;
}

.dots{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.dot{
width:10px;height:10px;
border-radius:50%;
background:#2b3a5a;
}

.dot.active{
background:#4fd1ff;
box-shadow:0 0 10px #4fd1ff;
}

/* ===== CARD ===== */
.card{
background:rgba(255,255,255,0.05);
border-radius:25px;
padding:40px;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,0.4);
backdrop-filter:blur(20px);
}

.title{
font-size:28px;
margin-bottom:10px;
}

.big{
font-size:80px;
font-weight:800;
margin:20px 0;
}

/* ===== BUTTON ===== */
.btn{
width:100%;
height:80px;
border:none;
border-radius:20px;
font-size:24px;
font-weight:bold;
background:linear-gradient(90deg,#4fd1ff,#9f7aea);
color:white;
cursor:pointer;
margin-top:20px;
}

/* ===== GAME ===== */
.box{
height:200px;
border-radius:20px;
border:2px solid #4fd1ff;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
margin-top:20px;
}

.bigCircle{
width:120px;
height:120px;
border-radius:50%;
background:#444;
margin:20px auto;
}

.target{
width:40px;
height:40px;
border-radius:50%;
background:#4fd1ff;
position:absolute;
cursor:pointer;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const app = document.getElementById("app");

/* ===== STATE ===== */
let game=0,total=0,score=0,user=null;

/* ===== UTIL ===== */
function render(html){
app.innerHTML=html;
}

function clearInput(){
window.onkeydown=null;
}

/* ===== SPACE GLOBAL ===== */
function bindSpace(action){
window.onkeydown=(e)=>{
if(e.code==="Space"){
e.preventDefault();
action();
}
};
}

/* ===== HEADER ===== */
function header(){
return `
<div class="header">
<div>MANCHE ${game+1} / 5</div>
<div class="dots">
${[0,1,2,3,4].map(i=>`<div class="dot ${i===game?"active":""}"></div>`).join("")}
</div>
</div>
`;
}

/* ===== MENU ===== */
function menu(){

render(`
<div class="card">
<h1 style="font-size:60px">timerz</h1>
<p style="opacity:0.7">Teste ta perception du temps</p>

<button class="btn" onclick="start()">Jouer (Espace)</button>
</div>
`);

bindSpace(start);
}

/* ===== START ===== */
function start(){
game=0;
total=0;
intro();
}

/* ===== INTRO ===== */
function intro(){

const texts=[
"Garde SPACE 5 secondes",
"Appuie au vert",
"Arrête à 9 secondes",
"Spam SPACE",
"Clique les cibles"
];

render(`
${header()}
<div class="card">
<div class="title">${texts[game]}</div>
<button class="btn" onclick="launch()">Prêt (Espace)</button>
</div>
`);

bindSpace(launch);
}

/* ===== LAUNCH ===== */
function launch(){
[g1,g2,g3,g4,g5][game]();
}

/* ===== GAME 1 ===== */
function g1(){

let start=0;

render(`${header()}<div class="card"><div class="title">Maintiens SPACE</div></div>`);

window.onkeydown=e=>{
if(e.code==="Space") start=Date.now();
};

window.onkeyup=e=>{
if(e.code!=="Space")return;

let t=Date.now()-start;
score=Math.max(0,1000-Math.abs(5000-t)/5);
end();
};
}

/* ===== GAME 2 ===== */
function g2(){

let green=false,start=0;

render(`${header()}<div class="card"><div class="bigCircle"></div></div>`);

setTimeout(()=>{
green=true;
start=Date.now();
document.querySelector(".bigCircle").style.background="green";
},1500+Math.random()*2000);

window.onkeydown=e=>{
if(e.code!=="Space"||!green)return;

score=Math.max(0,1000-(Date.now()-start));
end();
};
}

/* ===== GAME 3 ===== */
function g3(){

let running=false,start=0;

render(`${header()}<div class="card"><div class="title">Start / Stop</div></div>`);

window.onkeydown=e=>{
if(e.code!=="Space")return;

if(!running){
running=true;
start=Date.now();
}else{
let t=Date.now()-start;
score=Math.max(0,1000-Math.abs(9000-t)/8);
end();
}
};
}

/* ===== GAME 4 ===== */
function g4(){

let count=0,start=Date.now();

render(`${header()}<div class="card"><div class="box" id="b">0</div></div>`);

const b=document.getElementById("b");

window.onkeydown=e=>{
if(e.code!=="Space")return;
count++;
b.innerText=count;
};

setTimeout(()=>{
let cps=count/((Date.now()-start)/1000);
score=Math.min(1000,cps*150);
end();
},5000);
}

/* ===== GAME 5 ===== */
function g5(){

let hits=0,start=Date.now();

render(`${header()}<div class="card"><div class="box" id="box"></div></div>`);

const box=document.getElementById("box");

function finish(){
let t=(Date.now()-start)/1000;
score=Math.max(500,1000-t*180);
end();
}

for(let i=0;i<6;i++){

let d=document.createElement("div");
d.className="target";

d.style.left=Math.random()*80+"%";
d.style.top=Math.random()*80+"%";

d.onclick=()=>{
d.remove();
hits++;
if(hits>=6)finish();
};

box.appendChild(d);
}
}

/* ===== END ===== */
function end(){

clearInput();
total+=score;

render(`
${header()}
<div class="card">
<h2>+${Math.round(score)}</h2>
<p>Total : ${total}</p>
<button class="btn" onclick="next()">Continuer (Espace)</button>
</div>
`);

bindSpace(next);
}

/* ===== NEXT ===== */
function next(){
game++;
if(game>=5)finish();
else intro();
}

/* ===== FIN ===== */
function finish(){

render(`
<div class="card">
<h1>${total}</h1>
<button class="btn" onclick="menu()">Menu (Espace)</button>
</div>
`);

bindSpace(menu);
}

/* ===== START ===== */
menu();

</script>
</body>
</html>
