<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
overflow:hidden;
color:white;
}

#root{width:100%;height:100%;}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
}

h1{color:#00f0ff;font-size:48px;}
h2{font-size:26px;}
p{opacity:0.8}

button{
width:85%;
height:80px;
margin:10px;
border:none;
border-radius:18px;
font-size:20px;
font-weight:bold;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
}

input{
width:80%;
height:50px;
text-align:center;
font-size:18px;
margin:5px;
}

.box{
width:85%;
height:260px;
border-radius:20px;
border:2px solid #00f0ff;
position:relative;
background:rgba(0,255,255,0.06);
overflow:hidden;
}

.target{
width:40px;
height:40px;
border-radius:50%;
background:#00f0ff;
position:absolute;
box-shadow:0 0 15px #00f0ff;
cursor:pointer;
}

.bigCircle{
width:180px;
height:180px;
border-radius:50%;
background:gray;
box-shadow:0 0 25px black;
}

.big{font-size:55px;color:#00f0ff;}

</style>
</head>

<body>

<div id="root"></div>

<script type="module">

const root=document.getElementById("root");

let gameIndex=0;
let total=0;
let score=0;

let user=null;
let inputLocked=false;

/* ================= SAFE RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= LOGIN ================= */
function loginScreen(){

render(`
<div class="screen">
<h1>⚡ TYMERZ</h1>

<input id="u" placeholder="username">
<input id="p" type="password" placeholder="password">

<button onclick="login()">Connexion</button>

<p>Admin password: TYMERZ2026</p>
</div>
`);

}

window.login=()=>{

let u=document.getElementById("u").value;
let p=document.getElementById("p").value;

if(p==="TYMERZ2026"){
user="ADMIN";
localStorage.setItem("tymerz_user",user);
menu();
return;
}

if(!u || u.length<2) return;

user=u;
localStorage.setItem("tymerz_user",user);

menu();

};

/* ================= BOOT ================= */
boot();

function boot(){

user=localStorage.getItem("tymerz_user");

if(!user){
loginScreen();
}else{
menu();
}

}

/* ================= MENU ================= */
function menu(){

cleanupAll();

render(`
<div class="screen">
<h1>⚡ TYMERZ</h1>

<p>${user}</p>

<button onclick="start()">JOUER</button>
<button onclick="showBoard()">CLASSEMENT</button>
<button onclick="logout()">LOGOUT</button>
</div>
`);

}

window.logout=()=>{
localStorage.removeItem("tymerz_user");
user=null;
loginScreen();
};

/* ================= START ================= */
window.start=()=>{
gameIndex=0;
total=0;
next();
};

function next(){ intro(); }

/* ================= INTRO ================= */
function intro(){

cleanupAll();

const txt=[
"HOLD 5 SECONDES",
"FEU VERT",
"TOGGLE 9 SECONDES",
"SPAM",
"CIBLES"
];

render(`
<div class="screen">
<h2>${txt[gameIndex]}</h2>
<button onclick="startGame()">START</button>
</div>
`);

document.onkeydown=(e)=>{
if(e.code==="Space") startGame();
};

}

/* ================= CLEAN EVENTS ================= */
function cleanupAll(){
document.onkeydown=null;
document.onkeyup=null;
inputLocked=false;
}

/* ================= START GAME ================= */
window.startGame=()=>{

cleanupAll();
score=0;

if(gameIndex===0) game1();
if(gameIndex===1) game2();
if(gameIndex===2) game3();
if(gameIndex===3) game4();
if(gameIndex===4) game5();

};

/* ================= GAME 1 (FIXED) ================= */
function game1(){

let start=0;
let holding=false;
let timer=null;

render(`
<div class="screen">
<h2>MAINTIENS SPACE</h2>
<p>Objectif : 5 secondes</p>
</div>
`);

document.addEventListener("keydown",down);
document.addEventListener("keyup",up);

function down(e){

if(e.code!=="Space") return;

if(!holding){
holding=true;
start=Date.now();

timer=setTimeout(()=>{
score=1000;
end();
},5000);
}

}

function up(e){

if(e.code!=="Space") return;

if(!holding) return;

clearTimeout(timer);

let t=Date.now()-start;

score=Math.max(0,1000-Math.abs(5000-t)/5);

end(`⏱ ${(t/1000).toFixed(2)}s`);

}

function end(txt){
document.removeEventListener("keydown",down);
document.removeEventListener("keyup",up);
inputLocked=true;
endGame(txt);
}

}

/* ================= GAME 2 ================= */
function game2(){

let green=false;
let start=0;

render(`
<div class="screen">
<h2>ATTENDS VERT</h2>
<div class="bigCircle"></div>
</div>
`);

const c=document.querySelector(".bigCircle");

document.onkeydown=(e)=>{

if(e.code!=="Space") return;
if(!green) return;

score=Math.max(0,1000-(Date.now()-start));
endGame();

};

setTimeout(()=>{

green=true;
start=Date.now();
c.style.background="green";

},1500);

}

/* ================= GAME 3 FIXED ================= */
function game3(){

let running=false;
let start=0;

render(`
<div class="screen">
<h2>TOGGLE 9 SECONDES</h2>

<div id="btn" class="bigCircle"></div>

<p>SPACE ou click = start/stop</p>
</div>
`);

const btn=document.getElementById("btn");

function toggle(){

if(inputLocked) return;

if(!running){
running=true;
start=Date.now();
btn.style.background="green";
}else{
running=false;

let t=Date.now()-start;

score=Math.max(0,1000-Math.abs(9000-t)/8);

endGame(`⏱ ${(t/1000).toFixed(2)}s`);
}

}

document.onkeydown=(e)=>{
if(e.code==="Space") toggle();
};

btn.onclick=toggle;

}

/* ================= GAME 4 ================= */
function game4(){

let count=0;
let start=Date.now();

render(`
<div class="screen">
<h2>🔥 SPAM</h2>

<div class="box"></div>
<h1 id="c">0</h1>
</div>
`);

const c=document.getElementById("c");

document.onclick=()=>{if(!inputLocked){count++;c.innerText=count;}};

document.onkeydown=(e)=>{
if(e.code==="Space" && !inputLocked){
count++;
c.innerText=count;
}
};

setTimeout(()=>{

let t=(Date.now()-start)/1000;
let cps=count/t;

score=Math.min(1000,cps*120);

endGame(`🔥 ${count}`);

},5000);

}

/* ================= GAME 5 FIXED ================= */
function game5(){

let hits=0;
let needed=6;
let start=Date.now();

render(`
<div class="screen">
<h2>🎯 CIBLES RAPIDES</h2>

<div class="box" id="arena"></div>
<h1 id="h">0</h1>
</div>
`);

const arena=document.getElementById("arena");
const h=document.getElementById("h");

function spawn(){

arena.innerHTML="";

for(let i=0;i<needed;i++){

const t=document.createElement("div");
t.className="target";

t.style.left=Math.random()*80+"%";
t.style.top=Math.random()*80+"%";

t.onclick=()=>{

if(inputLocked) return;

hits++;
h.innerText=hits;
t.remove();

if(hits===needed){

let time=(Date.now()-start)/1000;

score = time < 3 ? 1000 : Math.max(400, 1000 - time*250);

endGame(`⚡ ${time.toFixed(2)}s`);
}

};

arena.appendChild(t);

}

}

spawn();

setTimeout(()=>{

if(hits<needed){
score=Math.min(1000,hits*(1000/needed));
endGame("timeout");
}

},3500);

}

/* ================= END ================= */
function endGame(detail=""){

inputLocked=true;

total+=score;

render(`
<div class="screen">
<h2>Score</h2>

<h1 class="big">${Math.round(score)}</h1>

<p>${detail}</p>

<p>Total: ${total}/5000</p>

<button onclick="nextGame()">SUIVANT</button>
</div>
`);

}

/* ================= NEXT ================= */
window.nextGame=()=>{

gameIndex++;

if(gameIndex>=5){
final();
}else{
next();
}

};

/* ================= FINAL ================= */
function final(){

saveScore();

render(`
<div class="screen">
<h1>🏆 FIN</h1>

<h2>${total}/5000</h2>

<button onclick="menu()">MENU</button>
<button onclick="start()">REJOUER</button>
<button onclick="showBoard()">CLASSEMENT</button>
</div>
`);

}

/* ================= LEADERBOARD (STABLE FINAL) ================= */
function saveScore(){

let board=[];

try{
board=JSON.parse(localStorage.getItem("board")||"[]");
}catch(e){
board=[];
}

board.push({
user:user||"guest",
total:total
});

board=board.filter(x=>x && typeof x.total==="number");

board.sort((a,b)=>b.total-a.total);

board=board.slice(0,10);

localStorage.setItem("board",JSON.stringify(board));

}

function showBoard(){

let board=[];

try{
board=JSON.parse(localStorage.getItem("board")||"[]");
}catch(e){
board=[];
}

render(`
<div class="screen">
<h2>🏆 CLASSEMENT</h2>

${board.length
? board.map((b,i)=>`
<p>${i+1}. ${b.user} — ${b.total}</p>
`).join("")
: "<p>Aucun score</p>"
}

<button onclick="menu()">BACK</button>
</div>
`);

}

</script>

</body>
</html>
