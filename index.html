<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
overflow:hidden;
color:white;
}

#root{
width:100%;
height:100%;
}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
}

h1{color:#00f0ff;font-size:50px;}
h2{font-size:26px;}

button{
width:85%;
height:85px;
margin:10px;
border:none;
border-radius:20px;
font-size:20px;
font-weight:bold;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
}

.box{
width:85%;
height:280px;
border-radius:20px;
border:2px solid #00f0ff;
background:rgba(0,255,255,0.08);
position:relative;
overflow:hidden;
}

.target{
width:40px;
height:40px;
border-radius:50%;
background:#00f0ff;
position:absolute;
cursor:pointer;
box-shadow:0 0 15px #00f0ff;
}

.big{
font-size:60px;
color:#00f0ff;
}

</style>
</head>

<body>

<div id="root"></div>

<script type="module">

const root=document.getElementById("root");

let gameIndex=0;
let totalScore=0;
let gameScore=0;
let canPlay=false;

/* ================= RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= BOOT ================= */
boot();

function boot(){
menu();
}

/* ================= MENU ================= */
function menu(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <button onclick="startGame()">JOUER</button>
</div>
`);

}

window.startGame=()=>{

gameIndex=0;
totalScore=0;
nextGame();

};

/* ================= GAME FLOW ================= */
function nextGame(){
showIntro();
}

/* ================= INTRO SCREEN ================= */
function showIntro(){

const texts=[
"⌛ Clique au bon moment",
"⚡ Réflexe SPACE",
"🔥 Spam rapide",
"🎯 Clique les cibles"
];

render(`
<div class="screen">
  <h2>${texts[gameIndex]}</h2>

  <p>Appuie sur START ou ESPACE</p>

  <button onclick="start()">START</button>
</div>
`);

window.onkeydown=(e)=>{
if(e.code==="Space") start();
};

}

/* ================= START GAME ================= */
window.start=()=>{

window.onkeydown=null;
gameScore=0;
canPlay=true;

if(gameIndex===0) game1();
if(gameIndex===1) game2();
if(gameIndex===2) game3();
if(gameIndex===3) game4();

};

/* ================= GAME 1 ================= */
function game1(){

let start=Date.now();

render(`
<div class="screen">
  <h2>⌛ SPACE au bon moment</h2>
</div>
`);

window.onkeydown=(e)=>{
if(!canPlay) return;

if(e.code==="Space"){
let t=Date.now()-start;
gameScore=Math.max(0,1000-Math.abs(5000-t));
endGame();
}
};

}

/* ================= GAME 2 ================= */
function game2(){

let go=false;
let start=0;

render(`
<div class="screen">
  <h2>⚡ Attends GO</h2>
</div>
`);

setTimeout(()=>{

go=true;
start=Date.now();

render(`
<div class="screen">
  <h2 class="big">GO!</h2>
</div>
`);

},1500);

window.onkeydown=(e)=>{
if(!canPlay) return;

if(e.code==="Space" && go){
gameScore=Math.max(0,1000-(Date.now()-start));
endGame();
}
};

}

/* ================= GAME 3 (SPAM FIXED) ================= */
function game3(){

let count=0;

render(`
<div class="screen">
  <h2>🔥 SPAM</h2>

  <div class="box" id="box"></div>
  <h1 id="c">0</h1>
</div>
`);

const box=document.getElementById("box");
const c=document.getElementById("c");

box.onclick=()=>{if(canPlay){count++;c.innerText=count;}};

window.onkeydown=(e)=>{
if(e.code==="Space" && canPlay){
count++;
c.innerText=count;
}
};

setTimeout(()=>{
gameScore=count*50;
endGame();
},5000);

}

/* ================= GAME 4 (NEW TARGET GAME) ================= */
function game4(){

let hits=0;

render(`
<div class="screen">
  <h2>🎯 Clique les cibles</h2>

  <div class="box" id="arena"></div>
  <h1 id="h">0</h1>
</div>
`);

const arena=document.getElementById("arena");
const h=document.getElementById("h");

function spawn(){

arena.innerHTML="";

for(let i=0;i<5;i++){

const t=document.createElement("div");
t.className="target";

t.style.left=Math.random()*80+"%";
t.style.top=Math.random()*80+"%";

t.onclick=()=>{
if(!canPlay) return;
hits++;
h.innerText=hits;
t.remove();
};

arena.appendChild(t);

}

}

spawn();

setTimeout(()=>{
gameScore=hits*80;
endGame();
},6000);

}

/* ================= END GAME ================= */
function endGame(){

canPlay=false;
window.onkeydown=null;

totalScore+=gameScore;

render(`
<div class="screen">
  <h2>Score épreuve</h2>
  <h1 class="big">${gameScore}</h1>

  <p>Total: ${totalScore}</p>

  <button onclick="next()">SUIVANT</button>
</div>
`);

}

/* ================= NEXT ================= */
window.next=()=>{

gameIndex++;

if(gameIndex>=4){
final();
}else{
nextGame();
}

};

/* ================= FINAL SCREEN ================= */
function final(){

render(`
<div class="screen">
  <h1>🏆 FIN</h1>

  <h2>Total Score</h2>
  <h1 class="big">${totalScore}</h1>

  <button onclick="menu()">CLASSEMENT</button>
  <button onclick="startGame()">REJOUER</button>
</div>
`);

}

</script>

</body>
</html>
