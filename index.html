<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYMERZ</title>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://lsgrfmweasnjzkwzhnys.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= STATE ================= */
let user=null;
let game=0;
let score=0;
let lock=true;

/* ================= ROOT ================= */
const root=document.getElementById("root");

/* ================= SESSION RESTORE ================= */
async function init(){

const { data } = await supabase.auth.getSession();

if(data.session){
  user = data.session.user;
  menu();
} else {
  loginScreen();
}

}

init();

/* ================= LOGIN SCREEN ================= */
function loginScreen(){

root.innerHTML=`
<div class="screen center">
  <h1>⚡ TYMERZ</h1>

  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">

  <button onclick="signup()">Créer compte</button>
  <button onclick="login()">Connexion</button>
</div>
`;

}

window.login=async()=>{

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const { data, error } = await supabase.auth.signInWithPassword({
  email,
  password
});

if(error) return alert(error.message);

user=data.user;
menu();

};

window.signup=async()=>{

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const { error } = await supabase.auth.signUp({
  email,
  password
});

if(error) return alert(error.message);

alert("Compte créé !");
};

/* ================= MENU ================= */
function menu(){

root.innerHTML=`
<div class="screen center">
  <h1>⚡ TYMERZ</h1>

  <button onclick="startGame()">Jouer</button>
  <button onclick="showLeaderboard()">Leaderboard</button>
  <button onclick="logout()">Logout</button>
</div>
`;

}

window.logout=async()=>{

await supabase.auth.signOut();
location.reload();

};

/* ================= LEADERBOARD ================= */
window.showLeaderboard=async()=>{

const { data } = await supabase
.from("users")
.select("*")
.order("score",{ascending:false})
.limit(10);

root.innerHTML=`
<div class="screen center">
  <h2>🏆 Leaderboard</h2>

  ${data.map(u=>`
    <p>${u.username || u.email} — ${u.score}</p>
  `).join("")}

  <button onclick="menu()">Retour</button>
</div>
`;

};

/* ================= GAME FLOW ================= */
window.startGame=()=>{

game=0;
score=0;
rules();

};

/* ================= RULES ================= */
function rules(){

const texts=[
"⌛ 5 secondes parfaites",
"⚡ Réflexe instantané",
"⏱ Stop parfait",
"🔥 Spam ESPACE",
"🎯 Click rapide"
];

root.innerHTML=`
<div class="screen center">
  <h2>${texts[game]}</h2>
  <button onclick="play()">START</button>
</div>
`;

}

window.play=()=>run();

/* ================= GAME ENGINE ================= */
function run(){

let start=Date.now();
lock=false;

root.innerHTML=`<div class="screen center big">GO</div>`;

/* GAME 1 */
if(game===0){

window.onkeydown=(e)=>{
if(lock) return;
if(e.code==="Space"){
score += 1000 - Math.abs(5 - (Date.now()-start)/1000)*200;
next();
}
};

}

/* GAME 2 */
if(game===1){

let go=false;

setTimeout(()=>{
go=true;
start=Date.now();
root.innerHTML=`<div class="screen center big">GO!</div>`;
},1500);

window.onkeydown=(e)=>{
if(lock) return;
if(e.code==="Space" && go){
score += 1000-(Date.now()-start);
next();
}
};

}

/* GAME 3 */
if(game===2){

window.onkeydown=(e)=>{
if(lock) return;
if(e.code==="Space"){
score += 800;
next();
}
};

}

/* GAME 4 */
if(game===3){

let c=0;
window.onkeydown=()=>c++;

setTimeout(()=>{
score += c*40;
next();
},5000);

}

/* GAME 5 */
if(game===4){

let clicks=0;
window.onclick=()=>clicks++;

setTimeout(()=>{
score += clicks*60;
next();
},5000);

}

}

/* ================= NEXT ================= */
async function next(){

lock=true;
game++;

if(game>=5){

await supabase
.from("users")
.update({ score })
.eq("id",user.id);

end();
return;

}

setTimeout(()=>rules(),700);

}

/* ================= END ================= */
function end(){

root.innerHTML=`
<div class="screen center">
  <h1>🏆 ${Math.round(score)}</h1>
  <button onclick="menu()">Menu</button>
</div>
`;

}

</script>

<style>

body{
margin:0;
height:100vh;
overflow:hidden;
background:#050510;
color:white;
font-family:Arial;
}

#root{
width:100%;
height:100%;
}

/* FULL SCREEN */
.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#0a0a12,#050507);
}

/* CENTER TEXT */
.center{text-align:center;gap:10px}

/* INPUT */
input{
padding:12px;
margin:5px;
border:none;
border-radius:10px;
width:220px;
background:#111;
color:white;
}

/* BUTTON */
button{
padding:15px;
margin:8px;
width:220px;
border:none;
border-radius:15px;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

/* BIG GAME TEXT */
.big{
font-size:60px;
color:#00f0ff;
text-shadow:0 0 25px #00f0ff;
}

</style>

<body>

<div id="root"></div>

</body>
</html>
