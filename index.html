<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYmerz</title>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://lsgrfmweasnjzkwzhnys.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
);

let user=null,totalScore=0,scores=[],game=-1;

// AUTH
async function signup(){
 const p=pseudo.value, pass=password.value;
 const {error}=await supabase.auth.signUp({email:p+"@tymerz.com",password:pass});
 alert(error?error.message:"Compte créé");
}
async function login(){
 const p=pseudo.value, pass=password.value;
 const {data,error}=await supabase.auth.signInWithPassword({email:p+"@tymerz.com",password:pass});
 if(error)return alert(error.message);
 user=data.user; next();
}

// SCORE
function setScore(v){
 let s=Math.max(0,Math.min(1000,Math.round(v)));
 totalScore+=s; scores.push(s);
 score.innerText="+"+s;
 score.classList.add("pop");
 setTimeout(()=>score.classList.remove("pop"),300);
 nextBtn.style.display="block";
}

async function saveScore(){
 const pseudo=user.email.split("@")[0];

 // garde meilleur score uniquement
 let {data}=await supabase.from("leaderboard").select("*").eq("username",pseudo);
 if(data.length===0){
  await supabase.from("leaderboard").insert({username:pseudo,score:totalScore});
 }else{
  if(totalScore>data[0].score){
    await supabase.from("leaderboard").update({score:totalScore}).eq("username",pseudo);
  }
 }
}

async function loadLeaderboard(){
 let {data}=await supabase.from("leaderboard").select("*").order("score",{ascending:false}).limit(10);
 return data;
}

function next(){game++;nextBtn.style.display="none";load();}

let space=false;
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!space){space=true;if(window.down)window.down();}});
document.addEventListener("keyup",e=>{if(e.code==="Space"){space=false;if(window.up)window.up();}});

async function load(){
 score.innerText=""; leaderboard.innerHTML="";
 window.down=null;window.up=null;

 if(game===-1){
  title.innerText="Connexion";
  content.innerHTML=`
  <input id="pseudo" placeholder="Pseudo"><br>
  <input id="password" type="password" placeholder="Mot de passe"><br>
  <button onclick="signup()">Créer</button>
  <button onclick="login()">Connexion</button>`;
 }

 else if(game===0){
  title.innerText="Maintiens 5 sec";
  content.innerHTML="<p>Maintiens ESPACE</p>";
  let s;
  window.down=()=>s=Date.now();
  window.up=()=>setScore(1000-Math.abs(5-(Date.now()-s)/1000)*200);
 }

 else if(game===1){
  title.innerText="Réaction";
  content.innerHTML="<p>Attends...</p>";
  let start,ready=false;
  setTimeout(()=>{ready=true;start=Date.now();content.innerHTML="<p class='go'>GO</p>";},2000+Math.random()*2000);
  window.down=()=>{if(ready)setScore(1000-(Date.now()-start));};
 }

 else if(game===2){
  title.innerText="10 sec";
  content.innerHTML="<p>Stop au bon moment</p>";
  let s=Date.now();
  window.down=()=>setScore(1000-Math.abs(10-(Date.now()-s)/1000)*100);
 }

 else if(game===3){
  title.innerText="Spam";
  content.innerHTML="<p>Spam espace</p>";
  let c=0;
  window.down=()=>c++;
  setTimeout(()=>setScore(c*50),5000);
 }

 else if(game===4){
  title.innerText="Points";
  content.innerHTML='<div id="zone"></div>';
  let z=zone,count=0,start=Date.now();

  function spawn(){
    z.innerHTML="";
    for(let i=0;i<5;i++){
      let d=document.createElement("div");
      d.className="dot";
      d.style.left=Math.random()*90+"%";
      d.style.top=Math.random()*90+"%";
      d.onclick=()=>{count++;spawn();};
      z.appendChild(d);
    }
  }
  spawn();
  setTimeout(()=>setScore(1000-(Date.now()-start)/10+count*50),5000);
 }

 else{
  await saveScore();
  let data=await loadLeaderboard();

  title.innerText="Résultat";
  content.innerHTML=`Total: ${totalScore}`;

  leaderboard.innerHTML="<h3>🏆 Classement</h3>"+
  data.map((p,i)=>`<div class='rank'>#${i+1} ${p.username} - ${p.score}</div>`).join("");
 }
}

window.signup=signup;window.login=login;window.next=next;
load();
</script>

<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#020617,#0f172a);color:white;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
.card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);padding:40px;border-radius:25px;box-shadow:0 0 60px rgba(0,0,0,0.8);text-align:center;width:360px;animation:fade 1s;}
@keyframes fade{from{opacity:0;transform:scale(.9);}to{opacity:1;}}
button{margin:10px;padding:12px 25px;border-radius:12px;border:1px solid #444;background:#111;color:white;cursor:pointer;transition:.2s;}
button:hover{box-shadow:0 0 15px cyan;transform:scale(1.05);}
input{margin:10px;padding:12px;border-radius:12px;border:1px solid #444;background:#000;color:white;}
.dot{width:40px;height:40px;background:cyan;border-radius:50%;position:absolute;cursor:pointer;box-shadow:0 0 15px cyan;}
#zone{height:300px;position:relative;}
.rank{padding:5px;margin:3px;background:rgba(255,255,255,0.05);border-radius:8px;}
.pop{animation:pop .3s;}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.5);}100%{transform:scale(1);}}
.go{color:lime;font-size:30px;animation:flash .5s infinite;}
@keyframes flash{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}
</style>

</head>
<body>
<div class="card">
<h1>⏱ TYmerz</h1>
<h2 id="title"></h2>
<div id="content"></div>
<p id="score"></p>
<button id="nextBtn" onclick="next()" style="display:none">Suivant</button>
<div id="leaderboard"></div>
</div>
</body>
</html>
