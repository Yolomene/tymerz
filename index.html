<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
overflow:hidden;
color:white;
}

#root{
width:100%;
height:100%;
}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
}

h1{
color:#00f0ff;
font-size:50px;
}

h2{
font-size:28px;
}

button{
width:85%;
height:85px;
margin:10px;
border:none;
border-radius:20px;
font-size:22px;
font-weight:bold;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
}

.box{
width:85%;
height:280px;
border-radius:25px;
border:2px solid #00f0ff;
background:rgba(0,255,255,0.08);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
}

.big{
font-size:70px;
color:#00f0ff;
}

</style>
</head>

<body>

<div id="root"></div>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const root=document.getElementById("root");

const supabase=createClient(
"https://lsgrfmweasnjzkwzhnys.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8"
);

/* ================= STATE ================= */
let user=null;
let gameIndex=0;
let score=0;
let locked=true;
let canPress=false;

/* ================= RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= BOOT ================= */
boot();

async function boot(){

const { data } = await supabase.auth.getSession();

if(data.session){
user=data.session.user;
menu();
}else{
login();
}

}

/* ================= LOGIN ================= */
function login(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <input id="u" placeholder="username">
  <input id="p" type="password" placeholder="password">

  <button onclick="signup()">Créer compte</button>
  <button onclick="signin()">Connexion</button>
</div>
`);

}

window.signin=async()=>{

const u=document.getElementById("u").value;
const p=document.getElementById("p").value;

const { data } = await supabase
.from("users")
.select("*")
.eq("username",u)
.eq("password",p)
.single();

if(!data) return alert("Erreur login");

user=data;
menu();

};

window.signup=async()=>{

const u=document.getElementById("u").value;
const p=document.getElementById("p").value;

await supabase
.from("users")
.insert({username:u,password:p,score:0});

alert("Compte créé !");
};

/* ================= MENU ================= */
function menu(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <button onclick="startGame()">JOUER</button>
</div>
`);

}

window.startGame=()=>{

gameIndex=0;
score=0;
nextGame();

};

/* ================= RULES ================= */
function rules(){

const r=[
"⌛ Clique au bon timing",
"⚡ Réflexe SPACE",
"🔥 Spam la zone",
"🎯 Click rapide"
];

render(`
<div class="screen">
  <h2>${r[gameIndex]}</h2>
  <button onclick="countdown()">START</button>
</div>
`);

}

/* ================= COUNTDOWN ================= */
function countdown(){

let c=3;

render(`<div class="screen"><h1 class="big">${c}</h1></div>`);

const i=setInterval(()=>{

c--;

if(c<=0){
clearInterval(i);
runGame();
return;
}

render(`<div class="screen"><h1 class="big">${c}</h1></div>`);

},800);

}

/* ================= GAME CONTROLLER ================= */
function nextGame(){

locked=true;
canPress=false;

rules();

}

/* ================= GAME ENGINE ================= */
function runGame(){

locked=false;
canPress=true;

/* RESET INPUTS */
window.onkeydown=null;

/* GAME 1 - TIMING */
if(gameIndex===0){

let start=Date.now();

render(`
<div class="screen">
  <h2>⌛ SPACE au bon moment</h2>
</div>
`);

window.onkeydown=(e)=>{
if(!canPress) return;

if(e.code==="Space"){
let t=Date.now()-start;
score += Math.max(0,1000-Math.abs(5000-t));
finish();
}
};

}

/* GAME 2 - REACTION */
if(gameIndex===1){

let go=false;
let start=0;

render(`
<div class="screen">
  <h2>⚡ Attends GO</h2>
</div>
`);

setTimeout(()=>{

go=true;
start=Date.now();

render(`
<div class="screen">
  <h2>GO!</h2>
</div>
`);

},1500);

window.onkeydown=(e)=>{
if(!canPress) return;

if(e.code==="Space" && go){
score += Math.max(0,1000-(Date.now()-start));
finish();
}
};

}

/* GAME 3 - SPAM (FIXED) */
if(gameIndex===2){

let count=0;

render(`
<div class="screen">
  <h2>🔥 SPAM CLICK</h2>

  <div id="box" class="box">CLICK HERE</div>
  <h1 id="c">0</h1>
</div>
`);

const box=document.getElementById("box");
const c=document.getElementById("c");

box.onclick=()=>{
if(!canPress) return;
count++;
c.innerText=count;
};

/* SPACE aussi OK */
window.onkeydown=(e)=>{
if(e.code==="Space" && canPress){
count++;
c.innerText=count;
}
};

setTimeout(()=>{

score += count*50;
finish();

},5000);

}

/* GAME 4 - CLICK */
if(gameIndex===3){

let clicks=0;

render(`
<div class="screen">
  <h2>🎯 CLICK RAPIDE</h2>

  <div class="box"></div>
</div>
`);

const box=document.querySelector(".box");

box.onclick=()=>{
if(!canPress) return;
clicks++;
};

setTimeout(()=>{

score += clicks*60;
finish();

},5000);

}

}

/* ================= FINISH GAME ================= */
async function finish(){

canPress=false;
window.onkeydown=null;

score=Math.max(0,score);

render(`
<div class="screen">
  <h2>Score</h2>
  <h1 class="big">${Math.round(score)}</h1>
</div>
`);

setTimeout(()=>{

gameIndex++;

if(gameIndex>=4){
end();
}else{
nextGame();
}

},1200);

}

/* ================= END ================= */
function end(){

render(`
<div class="screen">
  <h1>🏆 FIN</h1>
  <h2>${Math.round(score)}</h2>

  <button onclick="menu()">MENU</button>
</div>
`);

}

/* ================= GLOBAL ================= */
window.startGame=startGame;

</script>

</body>
</html>
