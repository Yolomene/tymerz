<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
height:100vh;
background: radial-gradient(circle at top, #0a1a3a, #020617);
color:white;
font-family: 'Segoe UI', sans-serif;
display:flex;
justify-content:center;
align-items:center;
}

#app{width:100%;max-width:1100px}

/* ===== MENU ===== */
.title{
font-size:80px;
font-weight:800;
color:#9bd1ff;
text-align:center;
text-shadow:0 0 40px rgba(100,200,255,0.6);
}

.menu{
display:flex;
justify-content:center;
gap:40px;
margin-top:40px;
}

.card{
background:rgba(255,255,255,0.05);
border-radius:25px;
padding:30px;
width:300px;
backdrop-filter:blur(20px);
}

.center{
width:400px;
text-align:center;
}

.btn{
width:100%;
height:80px;
border:none;
border-radius:20px;
font-size:24px;
font-weight:bold;
background:linear-gradient(90deg,#4fd1ff,#9f7aea);
color:white;
margin-top:20px;
cursor:pointer;
}

/* ===== GAME ===== */
.screen{
text-align:center;
}

.header{margin-bottom:20px}

.dot{
width:10px;height:10px;border-radius:50%;
background:#333;display:inline-block;margin:5px
}

.active{background:#4fd1ff}

.box{
height:200px;
border:2px solid #4fd1ff;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
margin-top:20px;
}

.bigCircle{
width:120px;height:120px;border-radius:50%;background:#444;margin:20px auto;
}

.target{
width:40px;height:40px;border-radius:50%;background:#4fd1ff;position:absolute;
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const app=document.getElementById("app");

/* ===== STATE ===== */
let user=null,game=0,total=0,score=0;

/* ===== INPUT SYSTEM PRO ===== */
let lastPress=0;

function spacePressed(){
let now=Date.now();
if(now-lastPress<250) return false; // 🔥 anti spam GLOBAL
lastPress=now;
return true;
}

function bindUI(fn){
window.onkeydown=(e)=>{
if(e.code==="Space" && !e.repeat && spacePressed()){
fn();
}
};
}

function clearInput(){
window.onkeydown=null;
}

/* ===== HEADER ===== */
function header(){
return `
<div class="header">
${[0,1,2,3,4].map(i=>`<span class="dot ${i===game?"active":""}"></span>`).join("")}
</div>`;
}

/* ===== LOGIN ===== */
function loginScreen(){

let saved=localStorage.getItem("user");

if(saved){
user=saved;
menu();
return;
}

app.innerHTML=`
<div class="title">timerz</div>
<div class="card center">
<input id="u" placeholder="Pseudo" style="height:50px;width:100%;text-align:center">
<button class="btn" onclick="login()">Connexion</button>
</div>
`;
}

window.login=()=>{
let u=document.getElementById("u").value;
if(!u)return;
user=u;
localStorage.setItem("user",u);
menu();
};

/* ===== MENU PROPRE ===== */
function menu(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

app.innerHTML=`
<div class="title">timerz</div>

<div class="menu">

<div class="card">
<h3>Podium</h3>
${board.slice(0,3).map((b,i)=>`<p>${i+1}. ${b.user} - ${b.total}</p>`).join("")}
</div>

<div class="card center">
<p style="color:#4ade80">Connecté : ${user}</p>

<button class="btn" onclick="start()">Jouer</button>

<button class="btn" onclick="leaderboard()">Classement</button>
<button class="btn" onclick="logout()">Déconnexion</button>
</div>

<div class="card">
<h3>Récents</h3>
${board.slice(-3).reverse().map(b=>`<p>${b.user} - ${b.total}</p>`).join("")}
</div>

</div>
`;

bindUI(start);
}

/* ===== START ===== */
function start(){
game=0;
total=0;
intro();
}

/* ===== INTRO ===== */
function intro(){

const txt=[
"Maintiens 5 secondes",
"Attends le vert",
"Arrête à 9 secondes",
"Spam espace",
"Cibles rapides"
];

app.innerHTML=`
<div class="screen">
${header()}
<div class="card center">
<h2>${txt[game]}</h2>
<button class="btn" onclick="launch()">Prêt</button>
</div>
</div>
`;

bindUI(launch);
}

/* ===== GAME 1 ===== */
function g1(){
let start=0;

app.innerHTML=`${header()}<div class="card center"><h2>Maintiens SPACE</h2></div>`;

window.onkeydown=e=>{
if(e.code==="Space"&&!e.repeat) start=Date.now();
};

window.onkeyup=e=>{
if(e.code!=="Space")return;

let t=Date.now()-start;
score=Math.max(0,Math.round(1000-Math.abs(5000-t)/5));
end(t);
};
}

/* ===== GAME 2 ===== */
function g2(){

let green=false,start=0;

app.innerHTML=`${header()}<div class="card center"><div class="bigCircle"></div></div>`;

setTimeout(()=>{
green=true;
start=Date.now();
document.querySelector(".bigCircle").style.background="green";
},1500+Math.random()*2000);

window.onkeydown=e=>{
if(e.code!=="Space"||!green||e.repeat)return;

let t=Date.now()-start;
score=Math.max(0,Math.round(1000-t));
end(t);
};
}

/* ===== GAME 3 ===== */
function g3(){

let running=false,start=0;

app.innerHTML=`${header()}<div class="card center"><h2>Start / Stop</h2></div>`;

window.onkeydown=e=>{
if(e.code!=="Space"||e.repeat)return;

if(!running){
running=true;
start=Date.now();
}else{
let t=Date.now()-start;
score=Math.max(0,Math.round(1000-Math.abs(9000-t)/8));
end(t);
}
};
}

/* ===== GAME 4 ===== */
function g4(){

let count=0,start=Date.now();

app.innerHTML=`${header()}<div class="card center"><div class="box" id="b">0</div></div>`;

const b=document.getElementById("b");

window.onkeydown=e=>{
if(e.code!=="Space"||e.repeat)return;

count++;
b.innerText=count;
};

setTimeout(()=>{
let t=(Date.now()-start);
let cps=count/(t/1000);

score=Math.min(1000,Math.round(cps*150));
end(t);
},5000);
}

/* ===== GAME 5 ===== */
function g5(){

let hits=0,start=Date.now();

app.innerHTML=`${header()}<div class="card center"><div class="box" id="box"></div></div>`;

const box=document.getElementById("box");

function finish(){
let t=(Date.now()-start);
score=Math.max(500,Math.round(1000-(t/1000)*180));
end(t);
}

for(let i=0;i<6;i++){

let d=document.createElement("div");
d.className="target";

d.style.left=Math.random()*80+"%";
d.style.top=Math.random()*80+"%";

d.onclick=()=>{
d.remove();
hits++;
if(hits>=6)finish();
};

box.appendChild(d);
}
}

/* ===== FLOW ===== */
function launch(){
[g1,g2,g3,g4,g5][game]();
}

function end(time){

clearInput();
total+=score;

app.innerHTML=`
${header()}
<div class="card center">
<h2>+${score}</h2>
<p>Temps : ${(time/1000).toFixed(2)}s</p>
<p>Total : ${total}</p>
<button class="btn" onclick="next()">Continuer</button>
</div>
`;

bindUI(next);
}

function next(){
game++;
if(game>=5)finish();
else intro();
}

function finish(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

board.push({user,total});
board.sort((a,b)=>b.total-a.total);

localStorage.setItem("board",JSON.stringify(board.slice(0,10)));

app.innerHTML=`
<div class="card center">
<h1>${total}</h1>
<button class="btn" onclick="menu()">Menu</button>
</div>
`;

bindUI(menu);
}

/* ===== LEADERBOARD ===== */
function leaderboard(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

app.innerHTML=`
<div class="card center">
<h2>Classement</h2>
${board.map((b,i)=>`<p>${i+1}. ${b.user} - ${b.total}</p>`).join("")}
<button class="btn" onclick="menu()">Retour</button>
</div>
`;

bindUI(menu);
}

/* ===== LOGOUT ===== */
function logout(){
localStorage.removeItem("user");
loginScreen();
}

/* ===== START ===== */
loginScreen();
</script>

</body>
</html>
