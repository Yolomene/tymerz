<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ================= SAFE STATE ================= */
const root=document.getElementById("root");

let supabase=null;
let user=null;
let game=0;
let score=0;
let locked=true;

/* ================= BOOT ================= */
function boot(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>
  <p>Chargement...</p>
</div>
`);

initSupabase();

}

window.onload=boot;

/* ================= INIT SUPABASE (NON BLOQUANT) ================= */
async function initSupabase(){

try{

supabase = createClient(
"https://lsgrfmweasnjzkwzhnys.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8"
);

const { data } = await supabase.auth.getSession();

if(data.session){
user=data.session.user;
menu();
}else{
loginScreen();
}

}catch(e){

console.log("Supabase error",e);
loginScreen();

}

}

/* ================= RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= LOGIN ================= */
function loginScreen(){

render(`
<div class="screen center">
  <h1>⚡ TYMERZ</h1>

  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">

  <button onclick="signup()">Créer compte</button>
  <button onclick="login()">Connexion</button>
</div>
`);

}

window.login=async()=>{

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const { data,error } = await supabase.auth.signInWithPassword({
email,password
});

if(error) return alert(error.message);

user=data.user;
menu();

};

window.signup=async()=>{

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const { error } = await supabase.auth.signUp({
email,password
});

if(error) return alert(error.message);

alert("Compte créé !");
};

/* ================= MENU ================= */
function menu(){

render(`
<div class="screen center">
  <h1>⚡ TYMERZ</h1>

  <button class="bigBtn" onclick="startGame()">JOUER</button>
  <button class="bigBtn" onclick="leaderboard()">LEADERBOARD</button>
</div>
`);

}

window.startGame=()=>{

game=0;
score=0;
rules();

};

/* ================= RULES ================= */
function rules(){

const txt=[
"⌛ Timing",
"⚡ Réflexe",
"⏱ Stop",
"🔥 Spam",
"🎯 Click"
];

render(`
<div class="screen center">
  <h2>${txt[game]}</h2>
  <button class="bigBtn" onclick="play()">START</button>
</div>
`);

}

window.play=()=>gameEngine();

/* ================= GAME ENGINE CLEAN ================= */
function gameEngine(){

locked=false;

render(`<div class="screen center big">GO</div>`);

/* SIMPLE SAFE GAME (base stable) */
window.onkeydown=(e)=>{

if(locked) return;

if(e.code==="Space"){
score += 500;
next();
}

};

}

/* ================= NEXT ================= */
function next(){

locked=true;
game++;

setTimeout(()=>{

if(game>=5){
end();
return;
}

rules();

},800);

}

/* ================= END ================= */
function end(){

render(`
<div class="screen center">
  <h1>🏆 ${score}</h1>
  <button class="bigBtn" onclick="menu()">MENU</button>
</div>
`);

}

/* ================= LEADERBOARD ================= */
window.leaderboard=async()=>{

const { data } = await supabase
.from("users")
.select("*")
.order("score",{ascending:false})
.limit(10);

render(`
<div class="screen center">
  <h2>🏆 LEADERBOARD</h2>

  ${data?.map(u=>`
    <p>${u.username || u.email} — ${u.score || 0}</p>
  `).join("") || "vide"}

  <button class="bigBtn" onclick="menu()">RETOUR</button>
</div>
`);

};

</script>
