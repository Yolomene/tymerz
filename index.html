<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ================= SUPABASE ================= */
const supabase = createClient(
"https://lsgrfmweasnjzkwzhnys.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8"
);

/* ================= STATE ================= */
let user=null;
let game=0;
let score=0;
let locked=true;

/* ================= ROOT ================= */
const root=document.getElementById("root");

/* ================= SESSION ================= */
async function init(){

const { data } = await supabase.auth.getSession();

if(data.session){
user=data.session.user;
menu();
}else{
loginScreen();
}

}

init();

/* ================= LOGIN ================= */
function loginScreen(){

root.innerHTML=`
<div class="screen center">
  <h1>⚡ TYMERZ</h1>

  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">

  <button onclick="signup()">Créer compte</button>
  <button onclick="login()">Connexion</button>
</div>
`;

}

window.login=async()=>{

const email=emailInput.value;
const password=passwordInput.value;

const { data,error } = await supabase.auth.signInWithPassword({
email,password
});

if(error) return alert(error.message);

user=data.user;
menu();

};

window.signup=async()=>{

const email=emailInput.value;
const password=passwordInput.value;

const { error } = await supabase.auth.signUp({
email,password
});

if(error) return alert(error.message);

alert("Compte créé !");
};

/* ================= MENU ================= */
function menu(){

root.innerHTML=`
<div class="screen center">
  <h1>⚡ TYMERZ</h1>

  <button class="bigBtn" onclick="start()">JOUER</button>
  <button class="bigBtn" onclick="leaderboard()">LEADERBOARD</button>
</div>
`;

}

window.start=()=>rules();

/* ================= RULES ================= */
function rules(){

const txt=[
"⌛ Clique au bon timing",
"⚡ Réflexe GO",
"⏱ Stop précis",
"🔥 Spam la zone",
"🎯 Click rapide"
];

root.innerHTML=`
<div class="screen center">
  <h2>${txt[game]}</h2>
  <button class="bigBtn" onclick="play()">START</button>
</div>
`;

}

window.play=()=>run();

/* ================= GAME ENGINE ================= */
function run(){

locked=true;
let start=Date.now();

root.innerHTML=`<div class="screen center big">READY</div>`;

/* ================= GAME 1 ================= */
if(game===0){

setTimeout(()=>{

root.innerHTML=`
<div class="screen center">
  <h2>⌛ Appuie à 5 secondes</h2>
  <div class="circle"></div>
</div>
`;

locked=false;

window.onkeydown=(e)=>{
if(locked) return;
if(e.code==="Space"){
let t=(Date.now()-start)/1000;
score += 1000 - Math.abs(5-t)*200;
next();
}
};

},500);

}

/* ================= GAME 2 ================= */
if(game===1){

let go=false;

setTimeout(()=>{

go=true;
start=Date.now();

root.innerHTML=`
<div class="screen center big">GO!</div>
`;

},1500);

window.onkeydown=(e)=>{
if(locked) return;
if(e.code==="Space" && go){
score += 1000-(Date.now()-start);
next();
}
};

}

/* ================= GAME 3 ================= */
if(game===2){

root.innerHTML=`
<div class="screen center">
  <h2>⏱ STOP EXACT</h2>
</div>
`;

window.onkeydown=(e)=>{
if(locked) return;
if(e.code==="Space"){
score += 900;
next();
}
};

}

/* ================= GAME 4 ================= */
if(game===3){

let count=0;

root.innerHTML=`
<div class="screen center">
  <h2>🔥 SPAM LA ZONE</h2>

  <div id="box" class="gameBox">TAP HERE</div>
  <div id="counter">0</div>
</div>
`;

const box=document.getElementById("box");
const counter=document.getElementById("counter");

box.onclick=()=>{
count++;
counter.innerText=count;
counter.classList.add("pop");
setTimeout(()=>counter.classList.remove("pop"),100);
};

setTimeout(()=>{
score += count*50;
next();
},5000);

}

/* ================= GAME 5 ================= */
if(game===4){

let clicks=0;

root.innerHTML=`
<div class="screen center">
  <h2>🎯 CLICK RAPIDE</h2>

  <div class="clickZone"></div>
</div>
`;

document.querySelector(".clickZone").onclick=()=>{
clicks++;
};

setTimeout(()=>{
score += clicks*60;
next();
},5000);

}

}

/* ================= NEXT ================= */
async function next(){

locked=true;
game++;

if(game>=5){

await supabase
.from("users")
.update({ score })
.eq("id",user.id);

end();
return;

}

setTimeout(()=>rules(),800);

}

/* ================= END ================= */
function end(){

root.innerHTML=`
<div class="screen center">
  <h1>🏆 ${Math.round(score)}</h1>
  <button class="bigBtn" onclick="menu()">MENU</button>
</div>
`;

}

/* ================= LEADERBOARD ================= */
async function leaderboard(){

const { data } = await supabase
.from("users")
.select("*")
.order("score",{ascending:false})
.limit(10);

root.innerHTML=`
<div class="screen center">
  <h2>🏆 LEADERBOARD</h2>

  ${data.map(u=>`
    <p>${u.username || u.email} — ${u.score}</p>
  `).join("")}

  <button class="bigBtn" onclick="menu()">RETOUR</button>
</div>
`;

}

window.login=login;
window.signup=signup;
window.menu=menu;

</script>

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial;
background:#050510;
color:white;
}

#root{
width:100%;
height:100%;
}

/* FULL SCREEN */
.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
}

/* BIG BUTTONS (IMPORTANT UX FIX) */
.bigBtn{
width:85%;
height:90px;
font-size:24px;
border-radius:25px;
border:none;
margin:10px;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
font-weight:bold;
}

/* INPUT */
input{
width:80%;
padding:15px;
margin:8px;
border:none;
border-radius:15px;
background:#111;
color:white;
font-size:16px;
}

/* GAME TEXT */
.big{
font-size:60px;
color:#00f0ff;
text-shadow:0 0 25px #00f0ff;
}

/* SPAM BOX */
.gameBox{
width:80%;
height:250px;
display:flex;
justify-content:center;
align-items:center;
border-radius:25px;
background:rgba(0,255,255,0.08);
border:2px solid #00f0ff;
font-size:28px;
margin-top:20px;
}

/* COUNTER */
#counter{
font-size:50px;
margin-top:20px;
color:#00f0ff;
}

/* CLICK ZONE */
.clickZone{
width:80%;
height:250px;
border-radius:25px;
background:rgba(123,97,255,0.1);
border:2px solid #7b61ff;
margin-top:20px;
}

/* CIRCLE */
.circle{
width:140px;
height:140px;
border-radius:50%;
border:3px solid #00f0ff;
box-shadow:0 0 25px #00f0ff;
margin:20px;
}

/* POP ANIMATION */
.pop{
transform:scale(1.2);
}

</style>

</body>
</html>
