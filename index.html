<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYmerz</title>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://lsgrfmweasnjzkwzhnys.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= STATE ================= */
let user=null;
let step=-1;
let score=0;

/* ================= UI ================= */
const app = document.getElementById("app");

/* ================= AUTH ================= */
async function signup(){
  const u = username.value;
  const p = password.value;

  const { error } = await supabase
    .from("users")
    .insert({ username:u, password:p, score:0 });

  if(error) return alert(error.message);
  alert("Compte créé !");
}

async function login(){
  const u=username.value;
  const p=password.value;

  const { data } = await supabase
    .from("users")
    .select("*")
    .eq("username",u)
    .eq("password",p);

  if(!data.length) return alert("Erreur login");

  user=data[0];
  next();
}

/* ================= SCORE ================= */
function add(v){
  score += Math.max(0,Math.min(1000,v));
  document.getElementById("score").innerText=score;
}

/* ================= FLOW ================= */
function next(){
  step++;
  render();
}

/* ================= SPACE CONTROL ================= */
let space=false;
document.addEventListener("keydown",(e)=>{
  if(e.code==="Space" && !space){
    space=true;
    window.press?.();
  }
});
document.addEventListener("keyup",(e)=>{
  if(e.code==="Space"){
    space=false;
    window.release?.();
  }
});

/* ================= GAMES ================= */
function render(){

app.innerHTML="";
window.press=null;
window.release=null;

/* LOGIN */
if(step===-1){
app.innerHTML=`
<div class="card">
<h1>⚡ TYMERZ</h1>
<input id="username" placeholder="Pseudo">
<input id="password" type="password" placeholder="Mot de passe">
<button onclick="signup()">Créer compte</button>
<button onclick="login()">Connexion</button>
</div>`;
}

/* GAME 1 */
else if(step===0){
title.innerText="⌛ Timing parfait";

let start;

window.press=()=>start=Date.now();
window.release=()=>{
add(1000-Math.abs(5000-(Date.now()-start))/5);
next();
};

app.innerHTML="<div class='hint'>Maintiens ESPACE 5 sec</div>";
}

/* GAME 2 */
else if(step===1){
title.innerText="⚡ Réflexe";

let go=false;
let t;

setTimeout(()=>{
go=true;
t=Date.now();
app.innerHTML="<div class='glow'>GO!</div>";
},1500+Math.random()*2000);

window.press=()=>{
if(go){
add(1000-(Date.now()-t));
next();
}
};

app.innerHTML="<div class='hint'>Attends...</div>";
}

/* GAME 3 */
else if(step===2){
title.innerText="⏱ Stop parfait";

let t=Date.now();

window.press=()=>{
add(1000-Math.abs(10000-(Date.now()-t))/10);
next();
};

app.innerHTML="<div class='hint'>Stop à 10s</div>";
}

/* GAME 4 */
else if(step===3){
title.innerText="🔥 Spam";

let c=0;

window.press=()=>c++;

setTimeout(()=>{
add(c*40);
next();
},5000);

app.innerHTML="<div class='hint'>Spam ESPACE</div>";
}

/* GAME 5 */
else if(step===4){
title.innerText="🎯 Focus dots";

let clicks=0;
let start=Date.now();

function spawn(){
app.innerHTML="";
for(let i=0;i<5;i++){
let d=document.createElement("div");
d.className="dot";
d.onclick=()=>{
clicks++;
spawn();
};
app.appendChild(d);
}
}

spawn();

setTimeout(()=>{
add(1000-(Date.now()-start)/10 + clicks*60);
next();
},5000);
}

/* END */
else{
app.innerHTML=`
<div class="card">
<h2>🏆 Score : ${score}</h2>
<button onclick="location.reload()">Rejouer</button>
</div>`;
}
}

window.signup=signup;
window.login=login;
window.next=next;

render();

</script>

<style>

body{
margin:0;
background:radial-gradient(circle,#0a0a12,#050507);
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

#app{
width:380px;
text-align:center;
animation:fade .4s ease;
}

.card{
background:rgba(255,255,255,0.06);
padding:25px;
border-radius:20px;
backdrop-filter:blur(20px);
box-shadow:0 0 40px rgba(0,255,255,0.08);
}

input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:10px;
background:#111;
color:white;
}

button{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:10px;
cursor:pointer;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
font-weight:bold;
}

.hint{
font-size:20px;
opacity:.7;
animation:pulse 1s infinite;
}

.glow{
font-size:30px;
color:#00f0ff;
text-shadow:0 0 20px #00f0ff;
animation:pop .3s ease;
}

.dot{
width:40px;
height:40px;
background:cyan;
border-radius:50%;
display:inline-block;
margin:5px;
box-shadow:0 0 10px cyan;
cursor:pointer;
}

@keyframes fade{
from{opacity:0;transform:scale(.95)}
to{opacity:1;transform:scale(1)}
}

@keyframes pulse{
0%,100%{opacity:.3}
50%{opacity:1}
}

@keyframes pop{
from{transform:scale(.5);opacity:0}
to{transform:scale(1);opacity:1}
}

</style>

</head>

<body>

<div>
<h1 id="title">⚡ TYmerz</h1>
<div id="app"></div>
<div style="margin-top:10px">Score: <span id="score">0</span></div>
</div>

</body>
</html>
