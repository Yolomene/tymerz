<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TYMERZ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://lsgrfmweasnjzkwzhnys.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= AUDIO ================= */
const sfx = {
  click: new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg"),
  start: new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"),
  success: new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg")
};

/* ================= STATE ================= */
let user=null;
let step=-1;
let game=0;
let score=0;

/* ================= UI ================= */
const app=document.getElementById("app");

/* ================= RANK ================= */
function getRank(s){
  if(s<1000) return "Bronze";
  if(s<3000) return "Silver";
  if(s<6000) return "Gold";
  if(s<10000) return "Platinum";
  return "Legend";
}

/* ================= AUTH ================= */
async function login(){
  const u=username.value;
  const p=password.value;

  const { data } = await supabase
    .from("users")
    .select("*")
    .eq("username",u)
    .eq("password",p);

  if(!data.length) return alert("Erreur");

  user=data[0];
  menu();
}

async function signup(){
  await supabase.from("users").insert({
    username:username.value,
    password:password.value,
    score:0
  });
  alert("Compte créé");
}

/* ================= SAVE ================= */
async function save(){
  await supabase
    .from("users")
    .update({ score })
    .eq("username",user.username);
}

/* ================= FLOW ================= */
function menu(){
  step=0;
  renderMenu();
}

/* ================= SCREENS ================= */
function renderMenu(){
  app.innerHTML=`
  <div class="card">
    <h1>⚡ TYMERZ</h1>
    <button onclick="nextScreen()">Jouer</button>
    <button onclick="leaderboard()">Leaderboard</button>
  </div>`;
}

window.nextScreen=()=>rules();

/* ================= RULE SCREEN ================= */
function rules(){
  sfx.start.play();

  const rules=[
    "⌛ 5 secondes parfaites",
    "⚡ Réflexe GO",
    "⏱ Stop parfait",
    "🔥 Spam ESPACE",
    "🎯 Click rapide"
  ];

  app.innerHTML=`
  <div class="card">
    <h2>${rules[game]}</h2>
    <p>Appuie sur ESPACE pour commencer</p>
    <button onclick="startGame()">START</button>
  </div>`;
}

window.startGame=()=>runGame();

/* ================= GAMES ================= */
function runGame(){

  sfx.click.play();

  app.innerHTML="<div class='glow'>GO</div>";

  setTimeout(()=>{
    gamePlay();
  },500);
}

/* ================= GAME ENGINE ================= */
function gamePlay(){

  let start=Date.now();

  if(game===0){
    window.onkeydown=(e)=>{
      if(e.code==="Space"){
        const t=(Date.now()-start)/1000;
        score+=Math.max(0,1000-Math.abs(5-t)*200);
        next();
      }
    };
  }

  if(game===1){
    let go=false;

    setTimeout(()=>{
      go=true;
      start=Date.now();
      app.innerHTML="<div class='glow'>GO!</div>";
    },2000);

    window.onkeydown=(e)=>{
      if(e.code==="Space" && go){
        score+=1000-(Date.now()-start);
        next();
      }
    };
  }

  if(game===2){
    window.onkeydown=(e)=>{
      if(e.code==="Space"){
        const t=(Date.now()-start)/1000;
        score+=1000-Math.abs(10-t)*100;
        next();
      }
    };
  }

  if(game===3){
    let c=0;
    window.onkeydown=()=>c++;

    setTimeout(()=>{
      score+=c*40;
      next();
    },5000);
  }

  if(game===4){
    let clicks=0;

    app.innerHTML="CLICK!";

    window.onclick=()=>clicks++;

    setTimeout(()=>{
      score+=clicks*60;
      next();
    },5000);
  }
}

/* ================= NEXT ================= */
function next(){
  sfx.success.play();
  save();
  game++;

  if(game>=5){
    result();
    return;
  }

  rules();
}

/* ================= RESULT ================= */
async function result(){

  const rank=getRank(score);

  app.innerHTML=`
  <div class="card">
    <h2>🏆 Score ${score}</h2>
    <h3>Rank: ${rank}</h3>
    <button onclick="location.reload()">Rejouer</button>
  </div>`;
}

/* ================= LEADERBOARD LIVE ================= */
async function leaderboard(){

  const { data } = await supabase
    .from("users")
    .select("*")
    .order("score",{ascending:false})
    .limit(10);

  app.innerHTML=
    "<div class='card'><h2>Leaderboard</h2>"+
    data.map(u=>`<p>${u.username} - ${u.score}</p>`).join("")+
    "</div>";
}

/* ================= LOGIN INIT ================= */
window.signup=signup;
window.login=login;

</script>

<style>

body{
margin:0;
overflow:hidden;
background:#050510;
color:white;
font-family:Arial;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

.card{
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:20px;
backdrop-filter:blur(20px);
text-align:center;
width:300px;
margin:auto;
margin-top:15%;
}

button{
width:100%;
padding:10px;
margin:5px;
border-radius:10px;
border:none;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
cursor:pointer;
}

.glow{
font-size:40px;
text-align:center;
color:#00f0ff;
text-shadow:0 0 20px #00f0ff;
animation:pop .3s;
}

@keyframes pop{
from{transform:scale(.5);opacity:0}
to{transform:scale(1);opacity:1}
}

</style>

</head>

<body>

<canvas id="bg"></canvas>

<div class="card">
<h1>⚡ TYMERZ</h1>
<input id="username" placeholder="pseudo">
<input id="password" type="password" placeholder="password">
<button onclick="signup()">Créer</button>
<button onclick="login()">Connexion</button>
</div>

</body>
</html>
