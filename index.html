<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
overflow:hidden;
color:white;
}

#root{
width:100%;
height:100%;
}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
}

h1{
color:#00f0ff;
font-size:50px;
}

h2{
color:white;
font-size:28px;
}

button{
width:85%;
height:85px;
margin:10px;
border:none;
border-radius:20px;
font-size:22px;
font-weight:bold;
color:white;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
}

input{
width:80%;
padding:15px;
margin:8px;
border:none;
border-radius:15px;
background:#111;
color:white;
font-size:16px;
}

.big{
font-size:70px;
color:#00f0ff;
text-shadow:0 0 20px #00f0ff;
}

.box{
width:85%;
height:280px;
border-radius:25px;
border:2px solid #00f0ff;
background:rgba(0,255,255,0.08);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="root">Loading...</div>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ================= ROOT ================= */
const root=document.getElementById("root");

/* ================= SUPABASE ================= */
const supabase=createClient(
"https://lsgrfmweasnjzkwzhnys.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8"
);

/* ================= STATE ================= */
let user=null;
let game=0;
let score=0;

/* ================= RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= BOOT ================= */
boot();

async function boot(){

const { data } = await supabase.auth.getSession();

if(data.session){
user=data.session.user;
menu();
}else{
login();
}

}

/* ================= LOGIN ================= */
function login(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <input id="u" placeholder="username">
  <input id="p" type="password" placeholder="password">

  <button onclick="signup()">Créer compte</button>
  <button onclick="signin()">Connexion</button>
</div>
`);

}

window.signin=async()=>{

const username=document.getElementById("u").value;
const password=document.getElementById("p").value;

const { data } = await supabase
.from("users")
.select("*")
.eq("username",username)
.eq("password",password)
.single();

if(!data){
alert("Identifiants incorrects");
return;
}

user=data;
menu();

};

window.signup=async()=>{

const username=document.getElementById("u").value;
const password=document.getElementById("p").value;

const { error } = await supabase
.from("users")
.insert({username,password,score:0});

if(error){
alert(error.message);
return;
}

alert("Compte créé !");
};

/* ================= MENU ================= */
function menu(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <button onclick="start()">JOUER</button>
  <button onclick="leaderboard()">LEADERBOARD</button>
</div>
`);

}

window.start=()=>{

game=0;
score=0;
transition();

};

/* ================= TRANSITION ================= */
function transition(){

render(`
<div class="screen">
  <h2>Préparation...</h2>
</div>
`);

setTimeout(()=>rules(),1200);

}

/* ================= RULES ================= */
function rules(){

const r=[
"⌛ Timing parfait",
"⚡ Réflexe",
"🔥 Spam",
"🎯 Click rapide"
];

render(`
<div class="screen">
  <h2>${r[game]}</h2>
  <button onclick="play()">START</button>
</div>
`);

}

window.play=()=>gameEngine();

/* ================= GAME ENGINE ================= */
function gameEngine(){

/* GAME 1 */
if(game===0){

let start=Date.now();

render(`
<div class="screen">
  <h2>⌛ SPACE au bon moment</h2>
  <div class="big">GO</div>
</div>
`);

window.onkeydown=(e)=>{
if(e.code==="Space"){
score += 1000-Math.abs(5000-(Date.now()-start));
next();
}
};

}

/* GAME 2 */
if(game===1){

let go=false;
let start=0;

render(`
<div class="screen">
  <h2>⚡ ATTENDS GO</h2>
</div>
`);

setTimeout(()=>{

go=true;
start=Date.now();

render(`
<div class="screen">
  <h2>GO!</h2>
  <div class="big">SPACE</div>
</div>
`);

},1500);

window.onkeydown=(e)=>{
if(e.code==="Space" && go){
score += 1000-(Date.now()-start);
next();
}
};

}

/* GAME 3 */
if(game===2){

let count=0;

render(`
<div class="screen">
  <h2>🔥 SPAM</h2>

  <div id="box" class="box">TAP</div>
  <h1 id="c">0</h1>
</div>
`);

const box=document.getElementById("box");
const c=document.getElementById("c");

box.onclick=()=>{
count++;
c.innerText=count;
};

setTimeout(()=>{
score += count*50;
next();
},5000);

}

/* GAME 4 */
if(game===3){

let clicks=0;

render(`
<div class="screen">
  <h2>🎯 CLICK RAPIDE</h2>

  <div class="box"></div>
</div>
`);

document.querySelector(".box").onclick=()=>{
clicks++;
};

setTimeout(()=>{
score += clicks*60;
next();
},5000);

}

}

/* ================= NEXT ================= */
async function next(){

game++;

if(game>=4){

await supabase
.from("users")
.update({score})
.eq("id",user.id);

end();
return;

}

setTimeout(()=>rules(),1000);

}

/* ================= END ================= */
function end(){

render(`
<div class="screen">
  <h1>🏆 FIN</h1>
  <h2>${Math.round(score)}</h2>

  <button onclick="menu()">MENU</button>
</div>
`);

}

/* ================= LEADERBOARD ================= */
window.leaderboard=async()=>{

const { data } = await supabase
.from("users")
.select("*")
.order("score",{ascending:false})
.limit(10);

render(`
<div class="screen">
  <h2>🏆 LEADERBOARD</h2>

  ${data.map(u=>`
    <p>${u.username} — ${u.score}</p>
  `).join("")}

  <button onclick="menu()">RETOUR</button>
</div>
`);

};

</script>

</body>
</html>
