<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://lsgrfmweasnjzkwzhnys.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= STATE ================= */
let user=null;
let step="login";
let game=0;
let score=0;

/* ================= ROOT ================= */
const root = document.getElementById("root");

/* ================= RENDER SYSTEM ================= */
function render(html, transition=true){

  const old = document.querySelector(".screen");

  if(old && transition){
    old.classList.add("out");
    setTimeout(()=>{
      root.innerHTML = html;
    },250);
  } else {
    root.innerHTML = html;
  }

}

/* ================= LOGIN ================= */
async function login(){

  const u = document.getElementById("u").value;
  const p = document.getElementById("p").value;

  const { data } = await supabase
    .from("users")
    .select("*")
    .eq("username",u)
    .eq("password",p);

  if(!data.length) return alert("Erreur login");

  user=data[0];
  menu();
}

async function signup(){

  await supabase.from("users").insert({
    username:document.getElementById("u").value,
    password:document.getElementById("p").value,
    score:0
  });

  alert("Compte créé !");
}

/* ================= MENU ================= */
function menu(){

  render(`
  <div class="screen full center">
    <h1>⚡ TYMERZ</h1>
    <button onclick="start()">Jouer</button>
    <button onclick="leaderboard()">Leaderboard</button>
  </div>
  `);

}

window.start=()=>rules();

/* ================= RULES ================= */
function rules(){

  const rules=[
    "⌛ Maintiens 5 secondes",
    "⚡ Réflexe instantané",
    "⏱ Stop parfait",
    "🔥 Spam ESPACE",
    "🎯 Click rapide"
  ];

  render(`
  <div class="screen full center">
    <h2>${rules[game]}</h2>
    <p>Appuie sur ESPACE pour commencer</p>
    <button onclick="play()">START</button>
  </div>
  `);

}

window.play=()=>runGame();

/* ================= GAME ENGINE ================= */
function runGame(){

  let start=Date.now();

  render(`<div class="screen full game">GO</div>`);

  setTimeout(()=>{

    /* GAME 1 */
    if(game===0){
      window.onkeydown=(e)=>{
        if(e.code==="Space"){
          const t=(Date.now()-start)/1000;
          score += 1000 - Math.abs(5-t)*200;
          next();
        }
      };
    }

    /* GAME 2 */
    if(game===1){
      let go=false;

      setTimeout(()=>{
        go=true;
        start=Date.now();
        render(`<div class="screen full game glow">GO!</div>`);
      },1500);

      window.onkeydown=(e)=>{
        if(e.code==="Space" && go){
          score += 1000-(Date.now()-start);
          next();
        }
      };
    }

    /* GAME 3 */
    if(game===2){
      window.onkeydown=(e)=>{
        if(e.code==="Space"){
          const t=(Date.now()-start)/1000;
          score += 1000 - Math.abs(10-t)*100;
          next();
        }
      };
    }

    /* GAME 4 */
    if(game===3){
      let c=0;
      window.onkeydown=()=>c++;

      setTimeout(()=>{
        score += c*40;
        next();
      },5000);
    }

    /* GAME 5 */
    if(game===4){
      let clicks=0;
      window.onclick=()=>clicks++;

      setTimeout(()=>{
        score += clicks*60;
        next();
      },5000);
    }

  },300);

}

/* ================= NEXT ================= */
function next(){

  game++;

  if(game>=5){
    end();
    return;
  }

  rules();

}

/* ================= END ================= */
function end(){

  render(`
  <div class="screen full center">
    <h1>🏆 ${Math.round(score)}</h1>
    <button onclick="location.reload()">Rejouer</button>
  </div>
  `);

}

/* ================= LEADERBOARD ================= */
async function leaderboard(){

  const { data } = await supabase
    .from("users")
    .select("*")
    .order("score",{ascending:false})
    .limit(10);

  render(`
  <div class="screen full center">
    <h2>Leaderboard</h2>
    ${data.map(u=>`<p>${u.username} - ${u.score}</p>`).join("")}
    <button onclick="menu()">Retour</button>
  </div>
  `);

}

window.login=login;
window.signup=signup;
window.menu=menu;

</script>

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial;
background:#050510;
color:white;
}

/* FULL SCREEN ENGINE */
#root{
width:100%;
height:100%;
}

/* SCREEN BASE */
.screen{
width:100%;
height:100%;
position:absolute;
top:0;
left:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:all .25s ease;
}

/* TRANSITION OUT */
.out{
opacity:0;
transform:scale(1.05);
filter:blur(10px);
}

/* FULL SCREEN LAYOUT */
.full{
background:radial-gradient(circle,#0a0a12,#050507);
}

/* CENTER */
.center{
text-align:center;
gap:10px;
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
font-weight:bold;
cursor:pointer;
width:200px;
}

/* INPUT */
input{
padding:10px;
margin:5px;
border-radius:10px;
border:none;
background:#111;
color:white;
width:200px;
}

/* GAME TEXT */
.game{
font-size:50px;
text-shadow:0 0 20px #00f0ff;
}

/* GLOW */
.glow{
color:#00f0ff;
text-shadow:0 0 20px #00f0ff;
}

</style>

</head>

<body>

<div id="root"></div>

<!-- LOGIN SCREEN INITIAL -->
<script>
document.getElementById("root").innerHTML=`
<div class="screen full center">
  <h1>⚡ TYMERZ</h1>
  <input id="u" placeholder="pseudo">
  <input id="p" type="password" placeholder="password">
  <button onclick="signup()">Créer compte</button>
  <button onclick="login()">Connexion</button>
</div>
`;
</script>

</body>
</html>
