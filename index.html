<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
overflow:hidden;
color:white;
}

#root{
width:100%;
height:100%;
}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
}

h1{color:#00f0ff;font-size:50px;}
h2{font-size:26px;}

button{
width:85%;
height:85px;
margin:10px;
border:none;
border-radius:20px;
font-size:20px;
font-weight:bold;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
}

.box{
width:85%;
height:280px;
border-radius:20px;
border:2px solid #00f0ff;
position:relative;
overflow:hidden;
background:rgba(0,255,255,0.06);
}

.target{
width:40px;
height:40px;
border-radius:50%;
background:#00f0ff;
position:absolute;
box-shadow:0 0 15px #00f0ff;
cursor:pointer;
}

.light{
width:120px;
height:120px;
border-radius:50%;
background:red;
box-shadow:0 0 40px red;
}

.big{font-size:60px;color:#00f0ff;}

</style>
</head>

<body>

<div id="root"></div>

<script type="module">

const root=document.getElementById("root");

/* ================= STATE ================= */
let gameIndex=0;
let total=0;
let score=0;

/* input control (IMPORTANT FIX) */
let canPlay=false;
let inputLocked=false;

/* ================= GLOBAL SPACE FIX ================= */
document.addEventListener("keydown",(e)=>{
if(e.code==="Space") e.preventDefault();
},{passive:false});

/* ================= RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= RESET INPUT ================= */
function resetInput(){
window.onkeydown=null;
window.onkeyup=null;
inputLocked=false;
}

/* ================= MENU ================= */
menu();

function menu(){

resetInput();

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <button onclick="startGame()">JOUER</button>
</div>
`);

}

/* ================= START ================= */
window.startGame=()=>{
gameIndex=0;
total=0;
nextGame();
};

/* ================= FLOW ================= */
function nextGame(){
showIntro();
}

/* ================= INTRO ================= */
function showIntro(){

resetInput();

const txt=[
"⌛ HOLD SPACE 5s",
"⚡ Feu rouge → vert",
"🔥 Spam rapide",
"🎯 Cibles rapides"
];

render(`
<div class="screen">
  <h2>${txt[gameIndex]}</h2>

  <p>Appuie sur ESPACE ou START</p>

  <button onclick="start()">START</button>
</div>
`);

window.onkeydown=(e)=>{
if(e.code==="Space") start();
};

}

/* ================= START GAME ================= */
window.start=()=>{

resetInput();
score=0;
canPlay=true;

if(gameIndex===0) game1();
if(gameIndex===1) game2();
if(gameIndex===2) game3();
if(gameIndex===3) game4();

};

/* ================= GAME 1 (HOLD SPACE FIXED) ================= */
function game1(){

let start=0;
let holding=false;
let timer;

canPlay=true;

render(`
<div class="screen">
  <h2>⌛ Appuie SPACE puis MAINTIENS</h2>
</div>
`);

window.onkeydown=(e)=>{

if(e.code!=="Space") return;
if(inputLocked) return;

if(!holding){
holding=true;
start=Date.now();

timer=setTimeout(()=>{
score=1000;
endGame();
},5000);
}

};

window.onkeyup=(e)=>{

if(e.code!=="Space") return;
if(!holding) return;

clearTimeout(timer);

let t=(Date.now()-start)/5000;

score=Math.max(0,Math.min(1000,t*1000));

endGame();

};

}

/* ================= GAME 2 (TRAFFIC LIGHT FIXED) ================= */
function game2(){

let green=false;
let start=0;

canPlay=true;

render(`
<div class="screen">
  <h2>Attends le VERT</h2>

  <div id="light" class="light"></div>
</div>
`);

const light=document.getElementById("light");

window.onkeydown=(e)=>{

if(e.code!=="Space") return;
if(!green) return;
if(inputLocked) return;

score=Math.max(0,1000-(Date.now()-start));
endGame();

};

setTimeout(()=>{

green=true;
start=Date.now();

light.style.background="green";
light.style.boxShadow="0 0 40px green";

},1500);

}

/* ================= GAME 3 (SPAM FIXED) ================= */
function game3(){

let count=0;

canPlay=true;

render(`
<div class="screen">
  <h2>🔥 SPAM</h2>

  <div class="box" id="box"></div>
  <h1 id="c">0</h1>
</div>
`);

const box=document.getElementById("box");
const c=document.getElementById("c");

box.onclick=()=>{
if(!canPlay) return;
count++;
c.innerText=count;
};

window.onkeydown=(e)=>{
if(e.code==="Space" && canPlay){
count++;
c.innerText=count;
}
};

setTimeout(()=>{

score=Math.min(1000,count*50);
endGame();

},5000);

}

/* ================= GAME 4 (TARGETS FIXED) ================= */
function game4(){

let hits=0;

canPlay=true;

render(`
<div class="screen">
  <h2>🎯 Clique les cibles</h2>

  <div class="box" id="arena"></div>
  <h1 id="h">0</h1>
</div>
`);

const arena=document.getElementById("arena");
const h=document.getElementById("h");

function spawn(){

arena.innerHTML="";

for(let i=0;i<5;i++){

const t=document.createElement("div");
t.className="target";

t.style.left=Math.random()*80+"%";
t.style.top=Math.random()*80+"%";

t.onclick=()=>{
if(!canPlay) return;
hits++;
h.innerText=hits;
t.remove();
};

arena.appendChild(t);

}

}

spawn();

setTimeout(()=>{

score=Math.min(1000,hits*200);
endGame();

},5000);

}

/* ================= END GAME ================= */
function endGame(){

canPlay=false;
inputLocked=true;
resetInput();

total+=score;

render(`
<div class="screen">
  <h2>Score épreuve</h2>
  <h1 class="big">${Math.round(score)}</h1>

  <p>Total: ${total}/5000</p>

  <button onclick="next()">SUIVANT</button>
</div>
`);

}

/* ================= NEXT ================= */
window.next=()=>{

gameIndex++;

if(gameIndex>=4){
final();
}else{
nextGame();
}

};

/* ================= FINAL ================= */
function final(){

resetInput();

render(`
<div class="screen">
  <h1>🏆 FIN</h1>

  <h2>${total}/5000</h2>

  <button onclick="menu()">CLASSEMENT</button>
  <button onclick="startGame()">REJOUER</button>
</div>
`);

}

</script>

</body>
</html>
