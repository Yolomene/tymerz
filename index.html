<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYMERZ</title>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://lsgrfmweasnjzkwzhnys.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= STATE ================= */
let user=null;
let game=0;
let score=0;

/* ================= UI ================= */
const app = document.getElementById("app");

/* ================= AUTH FIX PROPRE ================= */
async function login(){

  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  const { data, error } = await supabase
    .from("users")
    .select("*")
    .eq("username", u)
    .eq("password", p);

  if(error || !data.length){
    alert("Identifiants incorrects");
    return;
  }

  user = data[0];
  menu();
}

async function signup(){

  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  const { error } = await supabase
    .from("users")
    .insert({ username:u, password:p, score:0 });

  if(error){
    alert(error.message);
    return;
  }

  alert("Compte créé !");
}

/* ================= SAVE SCORE ================= */
async function save(){
  if(!user) return;
  await supabase
    .from("users")
    .update({ score })
    .eq("username", user.username);
}

/* ================= NAV ================= */
function menu(){
  app.innerHTML=`
    <div class="card">
      <h1>⚡ TYMERZ</h1>
      <button onclick="startGame()">Jouer</button>
      <button onclick="showLeaderboard()">Leaderboard</button>
    </div>
  `;
}

window.startGame = ()=>rules();

window.showLeaderboard = async ()=>{

  const { data } = await supabase
    .from("users")
    .select("*")
    .order("score",{ascending:false})
    .limit(10);

  app.innerHTML = `
    <div class="card">
      <h2>🏆 Leaderboard</h2>
      ${data.map(u=>`
        <p>${u.username} — ${u.score}</p>
      `).join("")}
      <button onclick="menu()">Retour</button>
    </div>
  `;
};

/* ================= RULE SCREEN ================= */
function rules(){

  const texts=[
    "⌛ Maintiens 5 secondes",
    "⚡ Réflexe GO",
    "⏱ Stop parfait",
    "🔥 Spam ESPACE",
    "🎯 Click rapide"
  ];

  app.innerHTML=`
    <div class="card">
      <h2>${texts[game]}</h2>
      <p>Appuie sur ESPACE pour commencer</p>
      <button onclick="play()">START</button>
    </div>
  `;
}

/* ================= GAME ENGINE ================= */
function play(){

  let start = Date.now();

  app.innerHTML="<div class='glow'>GO</div>";

  setTimeout(()=>{

    if(game===0){
      window.onkeydown=(e)=>{
        if(e.code==="Space"){
          const t=(Date.now()-start)/1000;
          score += 1000 - Math.abs(5-t)*200;
          next();
        }
      };
    }

    if(game===1){
      let go=false;

      setTimeout(()=>{
        go=true;
        start=Date.now();
        app.innerHTML="<div class='glow'>GO!</div>";
      },1500);

      window.onkeydown=(e)=>{
        if(e.code==="Space" && go){
          score += 1000-(Date.now()-start);
          next();
        }
      };
    }

    if(game===2){
      window.onkeydown=(e)=>{
        if(e.code==="Space"){
          const t=(Date.now()-start)/1000;
          score += 1000 - Math.abs(10-t)*100;
          next();
        }
      };
    }

    if(game===3){
      let c=0;
      window.onkeydown=()=>c++;

      setTimeout(()=>{
        score += c*40;
        next();
      },5000);
    }

    if(game===4){
      let clicks=0;

      app.innerHTML="<div class='glow'>CLICK!</div>";

      window.onclick=()=>clicks++;

      setTimeout(()=>{
        score += clicks*60;
        next();
      },5000);
    }

  },300);
}

/* ================= NEXT ================= */
function next(){
  save();
  game++;

  if(game>=5){
    end();
    return;
  }

  rules();
}

/* ================= END ================= */
function end(){

  app.innerHTML=`
    <div class="card">
      <h2>🏆 Score : ${Math.round(score)}</h2>
      <button onclick="location.reload()">Rejouer</button>
    </div>
  `;
}

/* expose */
window.login=login;
window.signup=signup;
window.menu=menu;

</script>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#0a0a12,#050507);
color:white;
font-family:Arial;
overflow:hidden;
}

.card{
background:rgba(255,255,255,0.06);
padding:25px;
border-radius:20px;
backdrop-filter:blur(20px);
width:320px;
text-align:center;
box-shadow:0 0 40px rgba(0,255,255,0.08);
}

input{
width:100%;
margin:5px 0;
padding:10px;
border-radius:10px;
border:none;
background:#111;
color:white;
}

button{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:10px;
cursor:pointer;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
font-weight:bold;
}

.glow{
font-size:40px;
color:#00f0ff;
text-shadow:0 0 20px #00f0ff;
animation:pop .3s ease;
}

@keyframes pop{
from{transform:scale(.5);opacity:0}
to{transform:scale(1);opacity:1}
}

</style>

</head>

<body>

<div class="card">
<h1>⚡ TYMERZ</h1>

<input id="username" placeholder="Pseudo">
<input id="password" type="password" placeholder="Mot de passe">

<button onclick="signup()">Créer compte</button>
<button onclick="login()">Connexion</button>

</div>

<div id="app"></div>

</body>
</html>
