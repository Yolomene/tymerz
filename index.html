<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
color:white;
font-family:Arial;
overflow:hidden;
}

#root{
width:100%;
height:100%;
}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
}

button{
width:85%;
height:90px;
margin:10px;
font-size:22px;
border:none;
border-radius:20px;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
font-weight:bold;
}

input{
width:80%;
padding:15px;
margin:8px;
border-radius:15px;
border:none;
background:#111;
color:white;
font-size:16px;
}

h1{
color:#00f0ff;
}

.big{
font-size:60px;
color:#00f0ff;
text-shadow:0 0 20px #00f0ff;
}

.box{
width:85%;
height:280px;
border-radius:25px;
border:2px solid #00f0ff;
background:rgba(0,255,255,0.08);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
cursor:pointer;
}

#counter{
font-size:50px;
margin-top:20px;
}

</style>
</head>

<body>

<div id="root">Loading...</div>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ================= STATE ================= */
const root=document.getElementById("root");

let supabase=null;
let user=null;
let game=0;
let score=0;
let locked=true;

/* ================= INIT SUPABASE ================= */
async function init(){

supabase=createClient(
"https://lsgrfmweasnjzkwzhnys.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8"
);

const { data } = await supabase.auth.getSession();

if(data.session){
user=data.session.user;
menu();
}else{
loginScreen();
}

}

init();

/* ================= RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= LOGIN ================= */
function loginScreen(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <input id="username" placeholder="username">
  <input id="password" type="password" placeholder="password">

  <button onclick="login()">Connexion</button>
  <button onclick="signup()">Créer compte</button>
</div>
`);

}

window.login=async()=>{

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

const { data } = await supabase
.from("users")
.select("*")
.eq("username",username)
.eq("password",password)
.single();

if(!data){
alert("Erreur login");
return;
}

user=data;
menu();

};

window.signup=async()=>{

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

const { error } = await supabase
.from("users")
.insert({username,password,score:0});

if(error) return alert(error.message);

alert("Compte créé !");
};

/* ================= MENU ================= */
function menu(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <button onclick="start()">JOUER</button>
  <button onclick="leaderboard()">LEADERBOARD</button>
</div>
`);

}

window.start=()=>{

game=0;
score=0;
rules();

};

/* ================= RULES ================= */
function rules(){

const txt=[
"⌛ Timing parfait",
"⚡ Réflexe GO",
"🔥 Spam click",
"🎯 Click rapide",
"⏱ Stop précis"
];

render(`
<div class="screen">
  <h2>${txt[game]}</h2>
  <button onclick="play()">START</button>
</div>
`);

}

window.play=()=>gameEngine();

/* ================= GAME ENGINE ================= */
function gameEngine(){

locked=false;

/* GAME 1 */
if(game===0){

let start=Date.now();

render(`
<div class="screen">
  <h2>⌛ Clique à 5 secondes</h2>
  <div class="big">GO</div>
</div>
`);

window.onkeydown=(e)=>{
if(e.code==="Space"){
let t=(Date.now()-start)/1000;
score += 1000 - Math.abs(5-t)*200;
next();
}
};

}

/* GAME 2 */
if(game===1){

let go=false;
let start=0;

render(`
<div class="screen">
  <h2>⚡ Attends le GO</h2>
  <div class="big">WAIT</div>
</div>
`);

setTimeout(()=>{

go=true;
start=Date.now();

render(`
<div class="screen">
  <h2>GO!</h2>
  <div class="big">SPACE</div>
</div>
`);

},1500);

window.onkeydown=(e)=>{
if(e.code==="Space" && go){
score += 1000-(Date.now()-start);
next();
}
};

}

/* GAME 3 - SPAM */
if(game===2){

let count=0;

render(`
<div class="screen">
  <h2>🔥 SPAM LA ZONE</h2>

  <div id="box" class="box">TAP</div>
  <div id="counter">0</div>
</div>
`);

const box=document.getElementById("box");
const counter=document.getElementById("counter");

box.onclick=()=>{
count++;
counter.innerText=count;
};

setTimeout(()=>{

score += count*50;
next();

},5000);

}

/* GAME 4 - CLICK */
if(game===3){

let clicks=0;

render(`
<div class="screen">
  <h2>🎯 CLICK RAPIDE</h2>

  <div class="box"></div>
</div>
`);

document.querySelector(".box").onclick=()=>{
clicks++;
};

setTimeout(()=>{

score += clicks*60;
next();

},5000);

}

}

/* ================= NEXT ================= */
async function next(){

locked=true;
game++;

if(game>=4){

await supabase
.from("users")
.update({score})
.eq("id",user.id);

end();
return;

}

setTimeout(()=>rules(),800);

}

/* ================= END ================= */
function end(){

render(`
<div class="screen">
  <h1>🏆 ${Math.round(score)}</h1>
  <button onclick="menu()">MENU</button>
</div>
`);

}

/* ================= LEADERBOARD ================= */
window.leaderboard=async()=>{

const { data } = await supabase
.from("users")
.select("*")
.order("score",{ascending:false})
.limit(10);

render(`
<div class="screen">
  <h2>🏆 LEADERBOARD</h2>

  ${data.map(u=>`
    <p>${u.username} — ${u.score}</p>
  `).join("")}

  <button onclick="menu()">RETOUR</button>
</div>
`);

};

</script>

</body>
</html>
