<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>
html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
color:white;
overflow:hidden;
}

#root{
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

button{
width:80%;
height:80px;
margin:10px;
font-size:20px;
border:none;
border-radius:20px;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
font-weight:bold;
}

h1{
color:#00f0ff;
}

</style>
</head>

<body>

<div id="root">BOOTING...</div>

<script>
console.log("🚀 TYMERZ SAFE START");

const root=document.getElementById("root");

/* ================= SAFE RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= BOOT IMMÉDIAT ================= */
render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>
  <p>BOOT OK</p>
  <button onclick="menu()">START</button>
</div>
`);

function menu(){

render(`
<div class="screen">
  <h1>MENU</h1>
  <button onclick="game()">JOUER</button>
  <button onclick="leader()">LEADERBOARD</button>
</div>
`);

}

function game(){

let score=0;

render(`
<div class="screen">
  <h2>Appuie sur ESPACE</h2>
  <p id="s">0</p>
</div>
`);

window.onkeydown=(e)=>{
if(e.code==="Space"){
score++;
document.getElementById("s").innerText=score;
}
};

}

function leader(){

render(`
<div class="screen">
  <h1>LEADERBOARD</h1>
  <p>(mode offline test)</p>
  <button onclick="menu()">RETOUR</button>
</div>
`);

}

</script>

</body>
</html>
