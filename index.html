<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
overflow:hidden;
color:white;
}

#root{
width:100%;
height:100%;
}

/* ================= HUD ================= */
.hud{
position:absolute;
top:20px;
left:0;
width:100%;
display:flex;
justify-content:space-between;
padding:0 20px;
font-size:18px;
opacity:0.9;
}

/* ================= SCREEN ================= */
.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
position:relative;
}

h1{color:#00f0ff;font-size:50px;}
h2{font-size:26px;}

button{
width:85%;
height:85px;
margin:10px;
border:none;
border-radius:20px;
font-size:20px;
font-weight:bold;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
}

/* ================= GAME UI ================= */
.box{
width:85%;
height:280px;
border-radius:20px;
border:2px solid #00f0ff;
position:relative;
overflow:hidden;
background:rgba(0,255,255,0.06);
}

.target{
width:40px;
height:40px;
border-radius:50%;
background:#00f0ff;
position:absolute;
box-shadow:0 0 15px #00f0ff;
cursor:pointer;
}

.light{
width:120px;
height:120px;
border-radius:50%;
background:red;
box-shadow:0 0 40px red;
}

.big{font-size:60px;color:#00f0ff;}

</style>
</head>

<body>

<div id="root"></div>

<script type="module">

const root=document.getElementById("root");

let gameIndex=0;
let total=0;
let score=0;
let canPlay=false;
let inputLocked=false;

/* ================= GLOBAL SPACE FIX ================= */
document.addEventListener("keydown",(e)=>{
if(e.code==="Space") e.preventDefault();
},{passive:false});

/* ================= RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= RESET ================= */
function reset(){
window.onkeydown=null;
window.onkeyup=null;
inputLocked=false;
}

/* ================= MENU ================= */
menu();

function menu(){

reset();

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <button onclick="startGame()">JOUER</button>
</div>
`);

}

/* ================= START ================= */
window.startGame=()=>{
gameIndex=0;
total=0;
next();
};

/* ================= FLOW ================= */
function next(){
intro();
}

/* ================= INTRO ================= */
function intro(){

reset();

const txt=[
"⌛ HOLD SPACE 5s",
"⚡ Feu rouge → vert",
"⏱ DOUBLE SPACE 9s",
"🔥 SPAM CLICK",
"🎯 Cibles rapides"
];

render(`
<div class="screen">
  <h2>${txt[gameIndex]}</h2>

  <button onclick="start()">START</button>
</div>
`);

window.onkeydown=(e)=>{
if(e.code==="Space") start();
};

}

/* ================= START ================= */
window.start=()=>{

reset();
score=0;
canPlay=true;

if(gameIndex===0) game1();
if(gameIndex===1) game2();
if(gameIndex===2) game3();
if(gameIndex===3) game4();
if(gameIndex===4) game5();

};

/* ================= HUD ================= */
function hud(timer="0.00"){

return `
<div class="hud">
  <div>Score: ${Math.round(total)}</div>
  <div>⏱ ${timer}s</div>
</div>
`;

}

/* ================= GAME 1 HOLD ================= */
function game1(){

let start=0;
let holding=false;
let timer;

render(`<div class="screen">${hud("0.00")}<h2>MAINTIENS SPACE</h2></div>`);

window.onkeydown=(e)=>{

if(e.code!=="Space" || inputLocked) return;

if(!holding){
holding=true;
start=Date.now();

timer=setTimeout(()=>{
score=1000;
endGame("perfect 5.00s");
},5000);
}

};

window.onkeyup=(e)=>{

if(e.code!=="Space" || !holding) return;

clearTimeout(timer);

let t=(Date.now()-start);

let s=1-Math.abs(5000-t)/5000;
score=Math.max(0,Math.min(1000,s*1000));

endGame(`temps: ${(t/1000).toFixed(2)}s`);
};

}

/* ================= GAME 2 LIGHT ================= */
function game2(){

let green=false;
let start=0;

render(`<div class="screen">${hud("0.00")}<h2>ATTENDS VERT</h2><div class="light"></div></div>`);

const light=document.querySelector(".light");

window.onkeydown=(e)=>{

if(e.code!=="Space" || inputLocked) return;
if(!green) return;

let t=Date.now()-start;
score=Math.max(0,1000-t);
endGame(`${(t/1000).toFixed(2)}s`);

};

setTimeout(()=>{

green=true;
start=Date.now();

light.style.background="green";
light.style.boxShadow="0 0 40px green";

},1500);

}

/* ================= GAME 3 DOUBLE SPACE ================= */
function game3(){

let started=false;
let start=0;
let waiting=false;

render(`<div class="screen">${hud("0.00")}<h2>SPACE → attendre 9s → SPACE</h2></div>`);

window.onkeydown=(e)=>{

if(e.code!=="Space" || inputLocked) return;

if(!started){

started=true;
start=Date.now();
waiting=true;

render(`<div class="screen">${hud("0.00")}<h2>ATTENDS 9s</h2></div>`);

setTimeout(()=>waiting=false,9000);

return;
}

if(started && !waiting){

let t=Date.now()-start;

score=Math.max(0,1000-(Math.abs(t-9000)/10));

endGame(`${(t/1000).toFixed(2)}s`);

}

};

}

/* ================= GAME 4 SPAM (FIXED BACK) ================= */
function game4(){

let count=0;
let start=Date.now();

render(`
<div class="screen">
${hud("0.00")}
<h2>🔥 SPAM CLICK</h2>

<div class="box" id="box"></div>
<h1 id="c">0</h1>
</div>
`);

const box=document.getElementById("box");
const c=document.getElementById("c");

box.onclick=()=>{if(!inputLocked){count++;c.innerText=count;}};

window.onkeydown=(e)=>{
if(e.code==="Space" && !inputLocked){
count++;
c.innerText=count;
}
};

setTimeout(()=>{

score=Math.min(1000,count*50);
endGame(`${((Date.now()-start)/1000).toFixed(2)}s`);

},5000);

}

/* ================= GAME 5 TARGETS ================= */
function game5(){

let hits=0;
let start=Date.now();

render(`
<div class="screen">
${hud("0.00")}
<h2>🎯 CLIC CIBLES</h2>

<div class="box" id="arena"></div>
<h1 id="h">0</h1>
</div>
`);

const arena=document.getElementById("arena");
const h=document.getElementById("h");

function spawn(){

arena.innerHTML="";

for(let i=0;i<5;i++){

const t=document.createElement("div");
t.className="target";

t.style.left=Math.random()*80+"%";
t.style.top=Math.random()*80+"%";

t.onclick=()=>{

if(inputLocked) return;

hits++;
h.innerText=hits;
t.remove();

if(hits===5){
score=1000;
endGame("perfect clear");
}

};

arena.appendChild(t);

}

}

spawn();

setTimeout(()=>{

if(hits<5){
score=Math.min(1000,hits*200);
endGame("timeout");
}

},5000);

}

/* ================= END ================= */
function endGame(detail=""){

inputLocked=true;
reset();

total+=score;

render(`
<div class="screen">
  <h2>Score épreuve</h2>

  <h1 class="big">${Math.round(score)}</h1>

  <p>${detail}</p>

  <p>Total: ${total}/5000</p>

  <button onclick="nextGame()">SUIVANT</button>
</div>
`);

}

/* ================= NEXT ================= */
window.nextGame=()=>{

gameIndex++;

if(gameIndex>=5){
final();
}else{
next();
}

};

/* ================= FINAL ================= */
function final(){

render(`
<div class="screen">
  <h1>🏆 FIN</h1>

  <h2>${total}/5000</h2>

  <button onclick="menu()">CLASSEMENT</button>
  <button onclick="startGame()">REJOUER</button>
</div>
`);

}

</script>

</body>
</html>
