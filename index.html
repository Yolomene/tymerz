<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
overflow:hidden;
color:white;
}

#root{
width:100%;
height:100%;
}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
}

h1{
color:#00f0ff;
font-size:48px;
}

h2{
font-size:26px;
}

button{
width:85%;
height:85px;
margin:10px;
border:none;
border-radius:20px;
font-size:20px;
font-weight:bold;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
}

input{
width:80%;
padding:15px;
margin:8px;
border:none;
border-radius:12px;
background:#111;
color:white;
font-size:16px;
}

.box{
width:85%;
height:260px;
border-radius:20px;
border:2px solid #00f0ff;
background:rgba(0,255,255,0.08);
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
}

.big{
font-size:60px;
color:#00f0ff;
}

</style>
</head>

<body>

<div id="root"></div>

<script type="module">

const root=document.getElementById("root");

/* ================= STATE ================= */
let gameIndex=0;
let score=0;
let canPlay=false;

/* ================= SAFE RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= BOOT ================= */
boot();

function boot(){
loginScreen();
}

/* ================= LOGIN (SIMPLIFIÉ = ZÉRO BUG) ================= */
function loginScreen(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <input id="u" placeholder="username">
  <input id="p" type="password" placeholder="password">

  <button onclick="login()">Connexion</button>
</div>
`);

}

window.login=()=>{

const u=document.getElementById("u").value;
const p=document.getElementById("p").value;

/* SIMPLE VALIDATION (pas backend pour éviter bug) */
if(u.length<1 || p.length<1){
alert("Remplis les champs");
return;
}

menu();

};

/* ================= MENU ================= */
function menu(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <button onclick="start()">JOUER</button>
</div>
`);

}

window.start=()=>{

gameIndex=0;
score=0;
rules();

};

/* ================= RULES ================= */
function rules(){

const rules=[
"⌛ Clique au bon moment",
"⚡ Réflexe SPACE",
"🔥 Spam click",
"🎯 Click rapide"
];

render(`
<div class="screen">
  <h2>${rules[gameIndex]}</h2>
  <button onclick="startGame()">START</button>
</div>
`);

}

window.startGame=()=>countdown();

/* ================= COUNTDOWN ================= */
function countdown(){

let c=3;

render(`<div class="screen"><h1 class="big">${c}</h1></div>`);

const i=setInterval(()=>{

c--;

if(c<=0){
clearInterval(i);
runGame();
return;
}

render(`<div class="screen"><h1 class="big">${c}</h1></div>`);

},700);

}

/* ================= GAME ENGINE ================= */
function runGame(){

canPlay=true;

/* RESET INPUT */
window.onkeydown=null;

/* ================= GAME 1 ================= */
if(gameIndex===0){

let start=Date.now();

render(`
<div class="screen">
  <h2>⌛ SPACE au bon moment</h2>
  <p>Attends ~5 secondes puis appuie</p>
</div>
`);

window.onkeydown=(e)=>{
if(!canPlay) return;

if(e.code==="Space"){
let t=Date.now()-start;
score += Math.max(0,1000-Math.abs(5000-t));
endGame();
}
};

}

/* ================= GAME 2 ================= */
if(gameIndex===1){

let go=false;
let start=0;

render(`
<div class="screen">
  <h2>⚡ ATTENDS GO</h2>
</div>
`);

setTimeout(()=>{

go=true;
start=Date.now();

render(`
<div class="screen">
  <h2 class="big">GO!</h2>
</div>
`);

},1500);

window.onkeydown=(e)=>{
if(!canPlay) return;

if(e.code==="Space" && go){
score += Math.max(0,1000-(Date.now()-start));
endGame();
}
};

}

/* ================= GAME 3 ================= */
if(gameIndex===2){

let count=0;

render(`
<div class="screen">
  <h2>🔥 SPAM CLICK</h2>

  <div id="box" class="box">CLICK</div>
  <h1 id="c">0</h1>
</div>
`);

const box=document.getElementById("box");
const c=document.getElementById("c");

box.onclick=()=>{
if(!canPlay) return;
count++;
c.innerText=count;
};

window.onkeydown=(e)=>{
if(e.code==="Space" && canPlay){
count++;
c.innerText=count;
}
};

setTimeout(()=>{

score += count*50;
endGame();

},5000);

}

/* ================= GAME 4 ================= */
if(gameIndex===3){

let clicks=0;

render(`
<div class="screen">
  <h2>🎯 CLICK RAPIDE</h2>

  <div class="box"></div>
</div>
`);

document.querySelector(".box").onclick=()=>{
if(!canPlay) return;
clicks++;
};

setTimeout(()=>{

score += clicks*60;
endGame();

},5000);

}

}

/* ================= END GAME ================= */
function endGame(){

canPlay=false;
window.onkeydown=null;

score=Math.max(0,score);

render(`
<div class="screen">
  <h1>Score</h1>
  <h2 class="big">${Math.round(score)}</h2>
</div>
`);

setTimeout(()=>{

gameIndex++;

if(gameIndex>=4){
end();
}else{
rules();
}

},1200);

}

/* ================= END ================= */
function end(){

render(`
<div class="screen">
  <h1>🏆 FIN</h1>
  <h2>${Math.round(score)}</h2>

  <button onclick="menu()">MENU</button>
</div>
`);

}

</script>

</body>
</html>
