<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
color:white;
font-family:Arial;
overflow:hidden;
}

#root{
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
}

/* écran debug visible OBLIGATOIRE */
.screen{
text-align:center;
}

h1{
color:#00f0ff;
}

</style>
</head>

<body>

<div id="root">Loading...</div>

<script>
console.log("🚀 TYMERZ BOOT START");

/* ================= ROOT ================= */
const root=document.getElementById("root");

/* ================= SAFE RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= BOOT TEST ================= */
render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>
  <p>BOOT OK</p>
  <p>Si tu vois ça → JS fonctionne</p>
  <button onclick="start()">TEST NEXT SCREEN</button>
</div>
`);

window.start=function(){
render(`
<div class="screen">
  <h1>🎮 GAME READY</h1>
  <p>Le moteur fonctionne</p>
</div>
`);
};

</script>

</body>
</html>
