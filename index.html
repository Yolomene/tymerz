<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>
html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
color:white;
overflow:hidden;
}

#root{width:100%;height:100%;}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

button{
width:80%;
height:75px;
margin:10px;
border:none;
border-radius:15px;
font-size:20px;
background:#00f0ff;
color:black;
font-weight:bold;
}

.box{
width:85%;
height:250px;
border:2px solid #00f0ff;
border-radius:20px;
position:relative;
}

.target{
width:40px;
height:40px;
border-radius:50%;
background:#00f0ff;
position:absolute;
cursor:pointer;
}

.bigCircle{
width:150px;
height:150px;
border-radius:50%;
background:gray;
}
</style>
</head>

<body>

<div id="root"></div>

<script>
const root = document.getElementById("root");

/* ================= STATE ================= */
let user = null;
let game = 0;
let total = 0;
let score = 0;

let keyHandler = null;

/* ================= SAFE RENDER ================= */
function render(html){
root.innerHTML = html;
}

/* ================= STORAGE LOGIN ================= */
function saveUser(u){
localStorage.setItem("ty_user", JSON.stringify(u));
}

function loadUser(){
try{
return JSON.parse(localStorage.getItem("ty_user"));
}catch(e){
return null;
}
}

function logout(){
localStorage.removeItem("ty_user");
user = null;
loginScreen();
}

/* ================= LOGIN ================= */
function loginScreen(){

let saved = loadUser();

if(saved){
user = saved.user;
menu();
return;
}

render(`
<div class="screen">
<h1>TYMERZ</h1>

<input id="u" placeholder="username" style="height:50px;width:80%;text-align:center;">
<input id="p" type="password" placeholder="password" style="height:50px;width:80%;text-align:center;">

<button onclick="login()">LOGIN</button>
</div>
`);
}

window.login = ()=>{
const u = document.getElementById("u").value;
const p = document.getElementById("p").value;

if(!u) return;

/* admin password simple */
if(p === "ADMIN123"){
user = "ADMIN_" + u;
}else{
user = u;
}

saveUser({user});
menu();
};

/* ================= MENU ================= */
function menu(){
clearInput();

render(`
<div class="screen">
<h1>TYMERZ</h1>
<p>${user}</p>

<button onclick="start()">PLAY</button>
<button onclick="leaderboard()">LEADERBOARD</button>
<button onclick="logout()">LOGOUT</button>
</div>
`);
}

/* ================= GAME FLOW ================= */
window.start = ()=>{
game = 0;
total = 0;
next();
};

function next(){
intro();
}

/* ================= INTRO ================= */
function intro(){

const names = [
"HOLD SPACE 5s",
"REACTION",
"TOGGLE",
"SPAM",
"CIBLES"
];

render(`
<div class="screen">
<h2>${names[game]}</h2>
<button onclick="startGame()">START</button>
</div>
`);
}

window.startGame = ()=>{
if(game===0) g1();
if(game===1) g2();
if(game===2) g3();
if(game===3) g4();
if(game===4) g5();
};

/* ================= CLEAN INPUT ================= */
function clearInput(){
if(keyHandler){
window.removeEventListener("keydown", keyHandler);
window.removeEventListener("keyup", keyHandler);
}
window.onclick = null;
}

/* ================= GAME 1 ================= */
function g1(){

let start=0;
let holding=false;

render(`<div class="screen"><h2>HOLD SPACE 5s</h2></div>`);

keyHandler = (e)=>{
if(e.code !== "Space") return;

if(e.type === "keydown" && !holding){
holding = true;
start = Date.now();
}

if(e.type === "keyup"){
let t = Date.now() - start;
score = Math.max(0, 1000 - Math.abs(5000 - t)/5);
endGame();
}
};

window.addEventListener("keydown", keyHandler);
window.addEventListener("keyup", keyHandler);
}

/* ================= GAME 2 ================= */
function g2(){

let green=false;
let start=0;

render(`<div class="screen"><h2>WAIT GREEN</h2><div class="bigCircle"></div></div>`);

setTimeout(()=>{
green=true;
start=Date.now();
document.querySelector(".bigCircle").style.background="green";
},1500);

window.onkeydown=(e)=>{
if(e.code!=="Space") return;
if(!green) return;

score=Math.max(0,1000-(Date.now()-start));
endGame();
};
}

/* ================= GAME 3 ================= */
function g3(){

let running=false;
let start=0;

render(`<div class="screen"><h2>TOGGLE SPACE</h2></div>`);

window.onkeydown=(e)=>{
if(e.code!=="Space") return;

if(!running){
running=true;
start=Date.now();
}else{
let t=Date.now()-start;
score=Math.max(0,1000-Math.abs(9000-t)/8);
endGame();
}
};
}

/* ================= GAME 4 ================= */
function g4(){

let count=0;
let start=Date.now();

render(`
<div class="screen">
<h2>SPAM CLICK</h2>
<h1 id="c">0</h1>
</div>
`);

window.onclick=()=>{
count++;
document.getElementById("c").innerText=count;
};

setTimeout(()=>{
let t=(Date.now()-start)/1000;
let cps=count/t;

score=Math.min(1000,cps*150);
endGame(`CPS ${cps.toFixed(2)}`);

},5000);
}

/* ================= GAME 5 ================= */
function g5(){

let hits=0;
let needed=6;
let start=Date.now();

render(`
<div class="screen">
<h2>CIBLES</h2>
<div class="box" id="box"></div>
</div>
`);

const box=document.getElementById("box");

for(let i=0;i<needed;i++){

const d=document.createElement("div");
d.className="target";

d.style.left=Math.random()*80+"%";
d.style.top=Math.random()*80+"%";

d.onclick=()=>{

hits++;
d.remove();

if(hits===needed){
let t=(Date.now()-start)/1000;
score=Math.max(500,1000-t*180);
endGame(`TIME ${t.toFixed(2)}s`);
}
};

box.appendChild(d);
}
}

/* ================= END ================= */
function endGame(detail=""){

total+=score;

render(`
<div class="screen">
<h2>SCORE</h2>
<h1>${Math.round(score)}</h1>
<p>${detail}</p>
<p>TOTAL ${total}</p>

<button onclick="nextGame()">NEXT</button>
</div>
`);
}

/* ================= NEXT ================= */
window.nextGame=()=>{
game++;
if(game>=5) final();
else next();
};

/* ================= FINAL ================= */
function final(){

saveBoard();

render(`
<div class="screen">
<h1>FIN</h1>
<h2>${total}</h2>

<button onclick="menu()">MENU</button>
<button onclick="start()">RETRY</button>
</div>
`);
}

/* ================= LEADERBOARD ================= */
function saveBoard(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

board.push({user,total});

board.sort((a,b)=>b.total-a.total);

localStorage.setItem("board",JSON.stringify(board.slice(0,10)));
}

function leaderboard(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

render(`
<div class="screen">
<h2>LEADERBOARD</h2>

${board.map((b,i)=>`
<p>${i+1}. ${b.user} - ${b.total}</p>
`).join("")}

<button onclick="menu()">BACK</button>
</div>
`);
}

/* ================= BOOT ================= */
loginScreen();

</script>

</body>
</html>
