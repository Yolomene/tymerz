<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYmerz</title>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// 🟢 SUPABASE CONFIG
const supabase = createClient(
  "https://lsgrfmweasnjzkwzhnys.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZ3JmbXdlYXNuanprd3pobnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTg5NjUsImV4cCI6MjA5MzAzNDk2NX0.zovLpylyQTNVx0AIOhUCCQ_BdnkghAU3isR3YHoLHY8"
);

// 🛡 SAFE MODE (évite crash)
window.onerror = (msg) => console.log("JS ERROR:", msg);

let user = null;
let total = 0;
let scores = [];
let game = -1;

// ---------------- DOM ----------------
const title = () => document.getElementById("title");
const content = () => document.getElementById("content");
const leaderboard = () => document.getElementById("leaderboard");
const scoreBox = () => document.getElementById("score");
const nextBtn = () => document.getElementById("nextBtn");

const pseudoInput = () => document.getElementById("pseudo");
const passInput = () => document.getElementById("password");

// ---------------- AUTH ----------------
async function signup(){
  const p = pseudoInput().value;
  const pw = passInput().value;

  const { error } = await supabase.auth.signUp({
    email: p + "@tymerz.com",
    password: pw
  });

  alert(error ? error.message : "Compte créé 🚀");
}

async function login(){
  const p = pseudoInput().value;
  const pw = passInput().value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email: p + "@tymerz.com",
    password: pw
  });

  if (error) return alert(error.message);

  user = data.user;
  next();
}

// ---------------- SCORE ----------------
function addScore(v){
  let s = Math.max(0, Math.min(1000, Math.round(v)));
  total += s;
  scores.push(s);

  scoreBox().innerText = "+" + s;
  nextBtn().style.display = "block";
}

// meilleur score uniquement
async function saveScore(){
  const name = user.email.split("@")[0];

  let { data } = await supabase
    .from("leaderboard")
    .select("*")
    .eq("username", name);

  if (!data || data.length === 0) {
    await supabase.from("leaderboard").insert({ username: name, score: total });
  } else {
    if (total > data[0].score) {
      await supabase.from("leaderboard").update({ score: total }).eq("username", name);
    }
  }
}

async function getLeaderboard(){
  let { data } = await supabase
    .from("leaderboard")
    .select("*")
    .order("score", { ascending: false })
    .limit(10);

  return data;
}

// ---------------- FLOW ----------------
function next(){
  game++;
  nextBtn().style.display = "none";
  load();
}

// SPACE CONTROL
let space = false;
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !space) {
    space = true;
    if (window.down) window.down();
  }
});

document.addEventListener("keyup", e => {
  if (e.code === "Space") {
    space = false;
    if (window.up) window.up();
  }
});

// ---------------- GAME ----------------
async function load(){
  content().innerHTML = "";
  leaderboard().innerHTML = "";
  scoreBox().innerText = "";

  window.down = null;
  window.up = null;

  // LOGIN
  if (game === -1) {
    title().innerText = "⚡ TYMERZ";
    content().innerHTML = `
      <input id="pseudo" placeholder="Pseudo">
      <input id="password" type="password" placeholder="Mot de passe">
      <button onclick="signup()">Créer compte</button>
      <button onclick="login()">Connexion</button>
    `;
  }

  // GAME 1
  else if (game === 0) {
    title().innerText = "⌛ 5 sec parfait";
    content().innerHTML = "<p>Maintiens ESPACE</p>";

    let start;
    window.down = () => start = Date.now();
    window.up = () => addScore(1000 - Math.abs(5 - (Date.now() - start)/1000) * 200);
  }

  // GAME 2
  else if (game === 1) {
    title().innerText = "⚡ Réaction";
    content().innerHTML = "<p>Attends...</p>";

    let start, ok = false;
    setTimeout(() => {
      ok = true;
      start = Date.now();
      content().innerHTML = "<p class='go'>GO!</p>";
    }, 1500 + Math.random() * 2000);

    window.down = () => {
      if (ok) addScore(1000 - (Date.now() - start));
    };
  }

  // GAME 3
  else if (game === 2) {
    title().innerText = "⏱ Stop parfait";
    content().innerHTML = "<p>Stop ESPACE</p>";

    let s = Date.now();
    window.down = () => addScore(1000 - Math.abs(10 - (Date.now() - s)/1000) * 100);
  }

  // GAME 4
  else if (game === 3) {
    title().innerText = "🔥 Spam";
    content().innerHTML = "<p>Spam ESPACE</p>";

    let c = 0;
    window.down = () => c++;

    setTimeout(() => addScore(c * 50), 5000);
  }

  // GAME 5
  else if (game === 4) {
    title().innerText = "🎯 Click rapide";
    content().innerHTML = "<div id='zone'></div>";

    setTimeout(() => {
      const zone = document.getElementById("zone");
      let clicks = 0;
      let start = Date.now();

      function spawn(){
        zone.innerHTML = "";

        for (let i = 0; i < 5; i++) {
          let d = document.createElement("div");
          d.className = "dot";
          d.style.left = Math.random() * 85 + "%";
          d.style.top = Math.random() * 85 + "%";

          d.onclick = () => {
            clicks++;
            spawn();
          };

          zone.appendChild(d);
        }
      }

      spawn();

      setTimeout(() => addScore(1000 - (Date.now() - start)/10 + clicks * 50), 5000);
    }, 50);
  }

  // RESULT
  else {
    await saveScore();

    let data = await getLeaderboard();

    title().innerText = "🏆 Résultat";
    content().innerHTML = `<div>Total : ${total}</div>`;

    leaderboard().innerHTML = "<h3>Classement</h3>" +
      data.map((p,i) => `#${i+1} ${p.username} - ${p.score}`).join("<br>");
  }
}

window.signup = signup;
window.login = login;
window.next = next;

load();
</script>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#0f172a,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(25px);
padding:40px;
border-radius:25px;
text-align:center;
width:380px;
box-shadow:0 0 80px rgba(0,0,0,0.8);
}

button{
padding:12px 20px;
margin:8px;
border-radius:12px;
border:1px solid #444;
background:#111;
color:white;
cursor:pointer;
}

button:hover{box-shadow:0 0 20px cyan;transform:scale(1.05);}

input{
padding:10px;
margin:8px;
border-radius:10px;
border:1px solid #444;
background:black;
color:white;
}

.dot{
width:35px;
height:35px;
border-radius:50%;
background:cyan;
position:absolute;
box-shadow:0 0 15px cyan;
cursor:pointer;
}

#zone{height:300px;position:relative;}

.go{color:lime;font-size:30px;}
</style>

</head>
<body>

<div class="card">
<h1>⚡ TYmerz</h1>
<h2 id="title"></h2>
<div id="content"></div>
<p id="score"></p>
<button id="nextBtn" onclick="next()" style="display:none">Suivant</button>
<div id="leaderboard"></div>
</div>

</body>
</html>
