<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYMERZ</title>

<style>

html,body{
margin:0;
height:100%;
background:#050510;
font-family:Arial;
overflow:hidden;
color:white;
}

#root{
width:100%;
height:100%;
}

.screen{
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#0a0a12,#050507);
}

h1{color:#00f0ff;font-size:50px;}
h2{font-size:26px;}

button{
width:85%;
height:85px;
margin:10px;
border:none;
border-radius:20px;
font-size:20px;
font-weight:bold;
background:linear-gradient(90deg,#00f0ff,#7b61ff);
color:white;
}

.box{
width:85%;
height:280px;
border-radius:20px;
border:2px solid #00f0ff;
position:relative;
overflow:hidden;
background:rgba(0,255,255,0.06);
}

.target{
width:40px;
height:40px;
border-radius:50%;
background:#00f0ff;
position:absolute;
box-shadow:0 0 15px #00f0ff;
cursor:pointer;
}

.light{
width:120px;
height:120px;
border-radius:50%;
background:red;
box-shadow:0 0 40px red;
}

.big{font-size:60px;color:#00f0ff;}

</style>
</head>

<body>

<div id="root"></div>

<script type="module">

const root=document.getElementById("root");

let gameIndex=0;
let total=0;
let score=0;
let canPlay=false;

/* ================= RENDER ================= */
function render(html){
root.innerHTML=html;
}

/* ================= BOOT ================= */
menu();

/* ================= MENU ================= */
function menu(){

render(`
<div class="screen">
  <h1>⚡ TYMERZ</h1>

  <button onclick="start()">JOUER</button>
</div>
`);

}

window.start=()=>{
gameIndex=0;
total=0;
next();
};

/* ================= FLOW ================= */
function next(){
intro();
}

/* ================= INTRO ================= */
function intro(){

const txt=[
"⌛ HOLD SPACE 5 secondes",
"⚡ Réflexe feu vert",
"🔥 Spam click",
"🎯 Cible rapide"
];

render(`
<div class="screen">
  <h2>${txt[gameIndex]}</h2>
  <button onclick="startGame()">START</button>
</div>
`);

window.onkeydown=(e)=>{
if(e.code==="Space") startGame();
};

}

/* ================= START ================= */
window.startGame=()=>{

window.onkeydown=null;
score=0;
canPlay=true;

if(gameIndex===0) game1();
if(gameIndex===1) game2();
if(gameIndex===2) game3();
if(gameIndex===3) game4();

};

/* ================= GAME 1 (HOLD SPACE) ================= */
function game1(){

let start=0;
let holding=false;
let timer;

render(`
<div class="screen">
  <h2>MAINTIENS SPACE 5s</h2>
  <p>Ne lâche pas</p>
</div>
`);

window.onkeydown=(e)=>{
if(e.code==="Space" && !holding){
holding=true;
start=Date.now();

timer=setTimeout(()=>{
score=1000;
end();
},5000);
}
};

window.onkeyup=()=>{
if(!holding) return;

clearTimeout(timer);

let t=(Date.now()-start)/5000;
score=Math.max(0,Math.min(1000,t*1000));
end();
};

}

/* ================= GAME 2 (TRAFFIC LIGHT) ================= */
function game2(){

let start=0;
let green=false;

render(`
<div class="screen">
  <h2>Attends le vert</h2>

  <div id="light" class="light"></div>
</div>
`);

const light=document.getElementById("light");

window.onkeydown=(e)=>{
if(!canPlay) return;

if(e.code==="Space" && green){
score=Math.max(0,1000-(Date.now()-start));
end();
}
};

setTimeout(()=>{

green=true;
start=Date.now();

light.style.background="green";
light.style.boxShadow="0 0 40px green";

},1500);

}

/* ================= GAME 3 (SPAM) ================= */
function game3(){

let count=0;

render(`
<div class="screen">
  <h2>🔥 SPAM</h2>

  <div class="box" id="box"></div>
  <h1 id="c">0</h1>
</div>
`);

const box=document.getElementById("box");
const c=document.getElementById("c");

box.onclick=()=>{if(canPlay){count++;c.innerText=count;}};

window.onkeydown=(e)=>{
if(e.code==="Space" && canPlay){
count++;
c.innerText=count;
}
};

setTimeout(()=>{
score=Math.min(1000,count*50);
end();
},5000);

}

/* ================= GAME 4 (TARGETS) ================= */
function game4(){

let hits=0;

render(`
<div class="screen">
  <h2>🎯 Cibles rapides</h2>

  <div class="box" id="arena"></div>
  <h1 id="h">0</h1>
</div>
`);

const arena=document.getElementById("arena");
const h=document.getElementById("h");

function spawn(){

arena.innerHTML="";

for(let i=0;i<5;i++){

const t=document.createElement("div");
t.className="target";

t.style.left=Math.random()*80+"%";
t.style.top=Math.random()*80+"%";

t.onclick=()=>{
if(!canPlay) return;
hits++;
h.innerText=hits;
t.remove();
};

arena.appendChild(t);

}

}

spawn();

setTimeout(()=>{
score=Math.min(1000,hits*200);
end();
},5000);

}

/* ================= END ================= */
function end(){

canPlay=false;
total+=score;

render(`
<div class="screen">
  <h2>Score épreuve</h2>
  <h1 class="big">${Math.round(score)}</h1>

  <p>Total: ${total}/5000</p>

  <button onclick="nextGame()">SUIVANT</button>
</div>
`);

}

/* ================= NEXT ================= */
window.nextGame=()=>{

gameIndex++;

if(gameIndex>=4){
final();
}else{
next();
}

};

/* ================= FINAL ================= */
function final(){

render(`
<div class="screen">
  <h1>🏆 FIN</h1>

  <h2>${total}/5000</h2>

  <button onclick="menu()">CLASSEMENT</button>
  <button onclick="start()">REJOUER</button>
</div>
`);

}

</script>

</body>
</html>
