<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
height:100vh;
background: radial-gradient(circle at top, #0a1a3a, #020617);
color:white;
font-family: 'Segoe UI', sans-serif;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

#app{
width:100%;
max-width:1200px;
}

/* ===== TITLE ===== */
.title{
font-size:90px;
font-weight:900;
text-align:center;
color:#9bd1ff;
text-shadow:0 0 40px rgba(100,200,255,0.7);
margin-bottom:30px;
}

/* ===== MENU ===== */
.menu{
display:flex;
gap:40px;
justify-content:center;
}

.card{
flex:1;
background:rgba(255,255,255,0.05);
padding:30px;
border-radius:25px;
backdrop-filter:blur(20px);
min-height:300px;
}

.center{
max-width:400px;
text-align:center;
}

.btn{
width:100%;
height:90px;
border:none;
border-radius:20px;
font-size:26px;
font-weight:bold;
background:linear-gradient(90deg,#4fd1ff,#9f7aea);
color:white;
margin-top:20px;
cursor:pointer;
}

/* ===== GAME ===== */
.screen{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.header{margin-bottom:20px}

.dot{
width:10px;height:10px;border-radius:50%;
background:#333;display:inline-block;margin:5px
}
.active{background:#4fd1ff}

.big{
font-size:70px;
font-weight:bold;
}

.box{
height:220px;
width:100%;
border:2px solid #4fd1ff;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
margin-top:20px;
}

.bigCircle{
width:140px;height:140px;border-radius:50%;background:#444;margin:20px auto;
}

.target{
width:45px;height:45px;border-radius:50%;background:#4fd1ff;position:absolute;
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const app=document.getElementById("app");

/* ===== STATE ===== */
let game=0,total=0,score=0,user=null;

/* ===== INPUT ENGINE ===== */
let keyDown=false;

function onPress(fn){
window.onkeydown=(e)=>{
if(e.code!=="Space")return;
if(keyDown)return;
keyDown=true;
fn();
};
window.onkeyup=(e)=>{
if(e.code==="Space") keyDown=false;
};
}

function clearInput(){
window.onkeydown=null;
window.onkeyup=null;
keyDown=false;
}

/* ===== HEADER ===== */
function header(){
return `
<div class="header">
${[0,1,2,3,4].map(i=>`<span class="dot ${i===game?"active":""}"></span>`).join("")}
</div>`;
}

/* ===== LOGIN ===== */
function loginScreen(){

let saved=localStorage.getItem("user");

if(saved){
user=saved;
menu();
return;
}

app.innerHTML=`
<div class="title">TYmerz</div>
<div class="menu">
<div class="card center">
<input id="u" placeholder="Pseudo" style="height:60px;width:100%;text-align:center;font-size:20px">
<button class="btn" onclick="login()">Connexion</button>
</div>
</div>
`;
}

window.login=()=>{
let u=document.getElementById("u").value;
if(!u)return;
user=u;
localStorage.setItem("user",u);
menu();
};

/* ===== MENU MASTER ===== */
function menu(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

app.innerHTML=`
<div class="title">timerz</div>

<div class="menu">

<div class="card">
<h3>🏆 Podium</h3>
${board.slice(0,3).map((b,i)=>`<p>${i+1}. ${b.user} - ${b.total}</p>`).join("")}
</div>

<div class="card center">
<p>Connecté : ${user}</p>

<button class="btn" onclick="start()">Jouer</button>
<button class="btn" onclick="leaderboard()">Classement</button>
<button class="btn" onclick="logout()">Déconnexion</button>
</div>

<div class="card">
<h3>🕒 Récents</h3>
${board.slice(-3).reverse().map(b=>`<p>${b.user} - ${b.total}</p>`).join("")}
</div>

</div>
`;

onPress(start);
}

/* ===== FLOW ===== */
function start(){
game=0;
total=0;
intro();
}

function intro(){

const txt=[
"Maintiens SPACE 5 secondes",
"Appuie quand c'est vert",
"Arrête à 9 secondes",
"Spam SPACE",
"Clique les cibles"
];

app.innerHTML=`
<div class="screen">
${header()}
<div class="card center">
<h2>${txt[game]}</h2>
<button class="btn" onclick="launch()">Prêt</button>
</div>
</div>
`;

onPress(launch);
}

/* ===== GAMES ===== */

function g1(){
let start=0;

app.innerHTML=`<div class="screen">${header()}<h2>Maintiens SPACE</h2></div>`;

window.onkeydown=e=>{
if(e.code==="Space"&&!keyDown){
keyDown=true;
start=Date.now();
}
};

window.onkeyup=e=>{
if(e.code==="Space"){
keyDown=false;
let t=Date.now()-start;
score=Math.max(0,Math.round(1000-Math.abs(5000-t)/5));
end(t);
}
};
}

function g2(){
let green=false,start=0;

app.innerHTML=`<div class="screen">${header()}<div class="bigCircle"></div></div>`;

setTimeout(()=>{
green=true;
start=Date.now();
document.querySelector(".bigCircle").style.background="green";
},1500+Math.random()*2000);

onPress(()=>{
if(!green)return;
let t=Date.now()-start;
score=Math.max(0,1000-t);
end(t);
});
}

function g3(){
let running=false,start=0;

app.innerHTML=`<div class="screen">${header()}<h2>Start / Stop</h2></div>`;

onPress(()=>{
if(!running){
running=true;
start=Date.now();
}else{
let t=Date.now()-start;
score=Math.max(0,1000-Math.abs(9000-t)/8);
end(t);
}
});
}

function g4(){
let count=0,start=Date.now();

app.innerHTML=`<div class="screen">${header()}<div class="box" id="b">0</div></div>`;

const b=document.getElementById("b");

onPress(()=>{
count++;
b.innerText=count;
});

setTimeout(()=>{
let t=Date.now()-start;
let cps=count/(t/1000);
score=Math.min(1000,Math.round(cps*150));
end(t);
},5000);
}

function g5(){

let hits=0,start=Date.now();

app.innerHTML=`<div class="screen">${header()}<div class="box" id="box"></div></div>`;

const box=document.getElementById("box");

function finish(){
let t=Date.now()-start;
score=Math.max(500,Math.round(1000-(t/1000)*180));
end(t);
}

for(let i=0;i<6;i++){
let d=document.createElement("div");
d.className="target";

d.style.left=Math.random()*80+"%";
d.style.top=Math.random()*80+"%";

d.onclick=()=>{
d.remove();
hits++;
if(hits>=6)finish();
};

box.appendChild(d);
}
}

/* ===== END ===== */
function launch(){
clearInput();
[g1,g2,g3,g4,g5][game]();
}

function end(time){
clearInput();
total+=Math.round(score);

app.innerHTML=`
<div class="screen">
${header()}
<h2>+${Math.round(score)}</h2>
<p>Temps : ${(time/1000).toFixed(2)}s</p>
<p>Total : ${total}</p>
<button class="btn" onclick="next()">Continuer</button>
</div>
`;

onPress(next);
}

function next(){
game++;
if(game>=5)finish();
else intro();
}

function finish(){

let board=JSON.parse(localStorage.getItem("board")||"[]");
board.push({user,total});
board.sort((a,b)=>b.total-a.total);
localStorage.setItem("board",JSON.stringify(board.slice(0,10)));

app.innerHTML=`
<div class="screen">
<h1>${total}</h1>
<button class="btn" onclick="menu()">Menu</button>
</div>
`;

onPress(menu);
}

/* ===== OTHER ===== */
function leaderboard(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

app.innerHTML=`
<div class="screen">
<h2>Classement</h2>
${board.map((b,i)=>`<p>${i+1}. ${b.user} - ${b.total}</p>`).join("")}
<button class="btn" onclick="menu()">Retour</button>
</div>
`;

onPress(menu);
}

function logout(){
localStorage.removeItem("user");
loginScreen();
}

/* ===== START ===== */
loginScreen();

</script>
</body>
</html>
